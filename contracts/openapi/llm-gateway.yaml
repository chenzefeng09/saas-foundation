# =============================================================================
# LLM Gateway Service API — llm-gateway-v1
# =============================================================================
# LiteLLM 封装 + 双协议（OpenAI-compatible + Anthropic Messages-compatible）
# + 能力探测 + 配额 + 跨境 + DLP 前置 + fallback
# =============================================================================

openapi: 3.1.0

info:
  title: LLM Gateway Service API
  version: 1.0.0
  description: |
    LLM 网关：唯一模型出口。
    详见 [docs/design/llm-gateway-v1.md](../../docs/design/llm-gateway-v1.md)。

servers:
  - url: https://api.example.com/api/llm-gateway/v1
  - url: http://localhost:8018/api/llm-gateway/v1

security:
  - bearerAuth: []

tags:
  - name: chat
    description: OpenAI-compatible /chat/completions
  - name: messages
    description: Anthropic-compatible /messages
  - name: providers
    description: Provider endpoints 管理
  - name: virtual-keys
    description: 租户虚拟 key
  - name: tenant-keys
    description: 按 run 铸造的短期虚拟 key
  - name: capabilities
    description: 能力探测
  - name: user-preferences
    description: 用户的模型偏好（本人；租户管理员处理数据主体请求时可代成员读取 / 删除）
  - name: health

paths:

  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: './_common.yaml#/components/schemas/HealthStatus' }

  /chat/completions:
    post:
      tags: [chat]
      summary: OpenAI-compatible chat completion（含 SSE 流式）
      operationId: chatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: ok
          headers:
            X-LLM-Provider:
              schema: { type: string }
            X-LLM-Model-Degradation:
              schema: { type: string }
              description: 模型降级标记（cap fallback）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
            text/event-stream:
              schema:
                type: string
                description: SSE chunks（OpenAI 格式）
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '403':
          description: DLP / 跨境 / 配额阻断
          content:
            application/problem+json:
              schema: { $ref: './_common.yaml#/components/schemas/Error' }
        '429': { $ref: './_common.yaml#/components/responses/RateLimited' }
        '502': { $ref: './_common.yaml#/components/responses/BadGateway' }
        '503': { $ref: './_common.yaml#/components/responses/ServiceUnavailable' }
        '504': { $ref: './_common.yaml#/components/responses/GatewayTimeout' }

  /chat:
    post:
      tags: [chat]
      summary: Legacy simplified chat endpoint. Delegates to /chat/completions logic (non-streaming only)
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string }
                      content: { type: string }
                temperature: { type: number, default: 0.7 }
                max_tokens: { type: integer, nullable: true }
                stream: { type: boolean, default: false }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /messages:
    post:
      tags: [messages]
      summary: Anthropic-compatible messages（含 SSE 流式）
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnthropicMessagesRequest' }
      responses:
        '200':
          description: ok
          headers:
            X-LLM-Provider:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicMessagesResponse' }
            text/event-stream:
              schema:
                type: string
                description: SSE chunks（Anthropic 格式）
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_common.yaml#/components/responses/RateLimited' }

  /models:
    get:
      tags: [providers]
      summary: 列租户可用模型
      operationId: listModels
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Model' }

  /providers:
    get:
      tags: [providers]
      operationId: listProviders
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Provider' }
    post:
      tags: [providers]
      operationId: registerProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterProviderRequest' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provider' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /providers/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [providers]
      operationId: deleteProvider
      responses:
        '204': { description: ok }

  /providers/{provider_id}/probe:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [capabilities]
      summary: 触发能力探测（function calling / streaming / context / parallel）
      operationId: probeProvider
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityProbeReport' }

  /virtual-keys:
    get:
      tags: [virtual-keys]
      operationId: listVirtualKeys
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VirtualKey' }
    post:
      tags: [virtual-keys]
      operationId: createVirtualKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, providers_allowed]
              properties:
                name: { type: string }
                providers_allowed:
                  type: array
                  items: { type: string }
                models_allowed:
                  type: array
                  items: { type: string }
                token_quota_monthly: { type: integer }
                expires_at: { type: string, format: date-time }
      responses:
        '201':
          description: ok（含明文 token 仅 1 次可见）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateVirtualKeyResponse' }

  /virtual-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [virtual-keys]
      operationId: revokeVirtualKey
      responses:
        '204': { description: ok }

  /tenant-keys/ephemeral:
    post:
      tags: [tenant-keys]
      operationId: mintEphemeralTenantKey
      description: |
        为一次 agent run（或一次 canvas / 标题调用）铸造短期虚拟 key，记下 `run_id`。
        过了 `expires_at`，`/chat/completions` 就以 403 VIRTUAL_KEY_MISMATCH 拒绝它；
        `POST /tenant-keys/revoke-run` 可提前停用。过期超过宽限期
        （`LLM_GATEWAY_EPHEMERAL_KEY_PURGE_GRACE_HOURS`，默认 168 小时）的 key 由网关的
        定时任务物理删除，之后查不到它对应的租户和 run。
        不传 `provider_id` 时，绑定租户最早创建的已启用 provider。

        只有平台内部服务（agent-platform 的 scheduler 与 BFF）能调用：须带
        `X-Actor: SERVICE` 与匹配的 `X-Internal-Service-Token`。actor 校验先于请求体字段校验和
        provider 查找：未认证的调用方得到 401 / 403，而不是 404 或字段校验的 422。
      security:
        - internalServiceToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MintEphemeralKeyRequest' }
      responses:
        '201':
          description: ok（明文 `virtual_key` 只在本响应出现，`GET /tenant-keys` 不列短期 key）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EphemeralTenantKey' }
        '401':
          description: 缺少 `X-Tenant-Id`（没有租户上下文）
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
        '403':
          $ref: './_common.yaml#/components/responses/Forbidden'
          description: PERMISSION_DENIED：actor 不是经认证的 SERVICE（没有 / 错误的 `X-Internal-Service-Token`、USER、ADMIN）
        '404':
          description: PROVIDER_NOT_FOUND：租户没有已启用的 provider，或 `provider_id` 不是本租户已启用的 provider
          content:
            application/problem+json:
              schema: { $ref: './_common.yaml#/components/schemas/Error' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /tenant-keys/revoke-run:
    post:
      tags: [tenant-keys]
      operationId: revokeRunTenantKeys
      description: |
        提前停用一个 run 的全部短期 key（scheduler 取消 run 时调用）。尽力而为：过期才是兜底，
        已过期、已停用或已被定时任务删除的 key 不计入 `disabled`。
        与铸造相同，只有带 `X-Actor: SERVICE` 与匹配 `X-Internal-Service-Token` 的平台内部服务能调用。
      security:
        - internalServiceToken: []
      parameters:
        - $ref: '#/components/parameters/ServiceActor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeRunKeysRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeRunKeysResponse' }
        '401':
          description: 缺少 `X-Tenant-Id`（没有租户上下文）
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
        '403':
          $ref: './_common.yaml#/components/responses/Forbidden'
          description: PERMISSION_DENIED：actor 不是经认证的 SERVICE
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /user-preferences:
    get:
      tags: [user-preferences]
      operationId: listUserPreferences
      description: 调用者本人的模型偏好（每个 purpose 至多一条）。
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferenceList' }

  /user-preferences/{purpose}:
    parameters:
      - name: purpose
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [user-preferences]
      operationId: deleteUserPreference
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  /users/{user_id}/preferences:
    description: |
      租户管理员代成员处理 GDPR 数据主体请求（访问 Art. 15 / 删除 Art. 17）时，读取或删除
      该成员的模型偏好。只接受 ADMIN 或 SERVICE actor（BFF 先校验租户管理员权限，再带
      `X-Actor: ADMIN`；SERVICE 须带匹配的 `X-Internal-Service-Token`），且只作用于调用方所在租户。
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, pattern: '^usr_[0-9A-Z]{26}$' }
    get:
      tags: [user-preferences]
      operationId: listMemberPreferences
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferenceList' }
        '403':
          $ref: './_common.yaml#/components/responses/Forbidden'
          description: PERMISSION_DENIED：actor 不是 ADMIN / SERVICE
    delete:
      tags: [user-preferences]
      operationId: deleteMemberPreferences
      description: '删除该成员的全部模型偏好；幂等，没有可删的返回 `deleted: 0`。'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer }
        '403':
          $ref: './_common.yaml#/components/responses/Forbidden'
          description: PERMISSION_DENIED：actor 不是 ADMIN / SERVICE

  /pricing:
    get:
      tags: [providers]
      summary: Get Model Pricing
      operationId: getModelPricing
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  /probe:
    post:
      tags: [capabilities]
      summary: Probe Endpoint
      operationId: probeEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, api_key]
              properties:
                url: { type: string }
                api_key: { type: string }
                provider_type: { type: string, default: openai_compatible }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      $ref: './_common.yaml#/components/securitySchemes/bearerAuth'
    internalServiceToken:
      type: apiKey
      in: header
      name: X-Internal-Service-Token
      description: |
        平台内部调用方（agent-platform 的 scheduler 与 BFF）与网关预共享的密钥，
        网关侧配置为 `LLM_GATEWAY_INTERNAL_SERVICE_TOKEN`；机制同 authz 的 `X-Internal-Admin-Token`。
        与 `X-Actor: SERVICE` 一起发送；不匹配、缺失或网关未配置（空值）时，网关把 SERVICE
        声明当作 USER。调用方不得把它交给自己启动的沙箱。

  parameters:
    ServiceActor:
      name: X-Actor
      in: header
      required: true
      description: 必须是 `SERVICE`，且由 `X-Internal-Service-Token` 证实
      schema: { type: string, enum: [SERVICE] }

  schemas:

    UserPreference:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        purpose: { type: string }
        model_id: { type: string }
        provider_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserPreferenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserPreference' }

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items:
            type: object
            properties:
              role: { type: string, enum: [system, user, assistant, tool] }
              content: {}
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean, default: false }
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice: {}
        stop:
          oneOf:
            - type: string
            - type: array
              items: { type: string }

    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { type: string, enum: [chat.completion] }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                type: object
                additionalProperties: true
              finish_reason: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }

    AnthropicMessagesRequest:
      type: object
      required: [model, messages, max_tokens]
      properties:
        model: { type: string }
        max_tokens: { type: integer }
        messages:
          type: array
          items:
            type: object
            properties:
              role: { type: string, enum: [user, assistant] }
              content: {}
        system: {}
        temperature: { type: number }
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          type: object
          additionalProperties: true
        stream: { type: boolean, default: false }
        stop_sequences:
          type: array
          items: { type: string }

    AnthropicMessagesResponse:
      type: object
      required: [id, type, role, content, model, stop_reason, usage]
      properties:
        id: { type: string }
        type: { type: string, enum: [message] }
        role: { type: string, enum: [assistant] }
        content:
          type: array
          items:
            type: object
            additionalProperties: true
        model: { type: string }
        stop_reason: { type: string }
        stop_sequence: { type: string, nullable: true }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }

    Model:
      type: object
      required: [id, provider_id, protocol, context_window]
      properties:
        id: { type: string }
        provider_id: { type: string }
        protocol: { type: string, enum: [OPENAI, ANTHROPIC] }
        context_window: { type: integer }
        max_output_tokens: { type: integer }
        capabilities:
          type: object
          properties:
            function_calling: { type: boolean }
            streaming: { type: boolean }
            parallel_tool_calls: { type: boolean }
            vision: { type: boolean }
            thinking_blocks: { type: boolean }
        recommended: { type: boolean }

    Provider:
      type: object
      required: [id, kind, name, status]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [ANTHROPIC, OPENAI, AZURE_OPENAI, BEDROCK, VERTEX, VLLM, LLAMA_CPP, OLLAMA, QWEN, DEEPSEEK]
        name: { type: string }
        endpoint: { type: string, format: uri }
        protocol: { type: string, enum: [OPENAI, ANTHROPIC] }
        models_available:
          type: array
          items: { type: string }
        cross_border:
          type: object
          properties:
            occurs: { type: boolean }
            destination_country: { type: string }
            safeguards:
              type: array
              items: { type: string }
        training_opt_out: { type: boolean, description: '必为 true；底座默认拒绝允许训练的 provider' }
        status: { type: string, enum: [ACTIVE, DEGRADED, DISABLED, PROBING] }
        last_probe_at: { type: string, format: date-time, nullable: true }

    RegisterProviderRequest:
      type: object
      required: [name, api_base, api_key, provider_type]
      properties:
        name: { type: string }
        api_base: { type: string }
        api_key: { type: string }
        provider_type: { type: string }
        models:
          type: array
          items: { type: string }
          default: []
        model_type_map:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        model_settings:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        capabilities_extra: { type: object, additionalProperties: true }

    CapabilityProbeReport:
      type: object
      required: [provider_id, probed_at, passed]
      properties:
        provider_id: { type: string }
        probed_at: { type: string, format: date-time }
        passed: { type: boolean }
        mandatory:
          type: object
          properties:
            function_calling: { type: boolean }
            streaming: { type: boolean }
            context_window_at_least_32k: { type: boolean }
            parallel_tool_calls: { type: boolean }
        optional:
          type: object
          additionalProperties: { type: boolean }
        notes: { type: string }
        latency_ms: { type: integer }

    VirtualKey:
      type: object
      required: [id, name, prefix, status, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        providers_allowed:
          type: array
          items: { type: string }
        models_allowed:
          type: array
          items: { type: string }
        token_quota_monthly: { type: integer, nullable: true }
        tokens_used_this_period: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED, QUOTA_EXCEEDED] }
        created_at: { type: string, format: date-time }

    CreateVirtualKeyResponse:
      allOf:
        - $ref: '#/components/schemas/VirtualKey'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: 明文 token，仅本响应可见

    MintEphemeralKeyRequest:
      type: object
      required: [run_id, ttl_seconds]
      properties:
        run_id:
          type: string
          minLength: 1
          maxLength: 64
          description: 记在 key 上，供审计和 `revoke-run` 使用
        ttl_seconds:
          type: integer
          description: 存活秒数；网关钳制到 60–86400
        provider_id:
          type: string
          description: 须是本租户已启用的 provider；省略时取最早创建的那个
        rate_limit_rpm:
          type: integer
          default: 60
          description: 记录在 key 上；网关目前不据此限流

    EphemeralTenantKey:
      type: object
      required: [id, virtual_key, provider_id, name, rate_limit_rpm, enabled, run_id, ephemeral, expires_at]
      properties:
        id: { type: string }
        virtual_key:
          type: string
          description: 明文 key（`sk-foundation-eph-` 前缀）
        provider_id: { type: string }
        name:
          type: string
          description: '`run:<run_id>`'
        rate_limit_rpm: { type: integer }
        enabled: { type: boolean }
        run_id: { type: string }
        ephemeral: { type: boolean, const: true }
        expires_at: { type: string, format: date-time }

    RevokeRunKeysRequest:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
          description: 铸造时记在 key 上的 `run_id`

    RevokeRunKeysResponse:
      type: object
      required: [run_id, disabled]
      properties:
        run_id: { type: string }
        disabled:
