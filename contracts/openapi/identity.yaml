# =============================================================================
# Identity Service API — identity-v1
# =============================================================================
# 配套设计：docs/design/identity-v1.md + docs/design/auth-flows-v1.md
# Owner: Identity Team
# =============================================================================

openapi: 3.1.0

info:
  title: Identity Service API
  version: 1.0.0
  description: |
    身份服务：用户、会话、SSO、社交登录、MFA、SCIM、密码 / Session 策略。
    封装 Keycloak Admin API。详见 [docs/design/identity-v1.md](../../docs/design/identity-v1.md)。

servers:
  - url: https://api.example.com/api/identity/v1
  - url: http://localhost:8001/api/identity/v1

security:
  - bearerAuth: []

tags:
  - name: sessions
    description: 登录 / 登出 / 会话管理
  - name: users
    description: 用户档案 CRUD
  - name: mfa
    description: 多因素认证
  - name: sso
    description: 企业 SSO 配置（每租户）
  - name: social
    description: 社交登录配置
  - name: scim
    description: SCIM 2.0 server endpoints
  - name: policies
    description: 密码 / Session / MFA 策略
  - name: health
    description: 健康检查

paths:

  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: alive
          content:
            application/json:
              schema: { $ref: './_common.yaml#/components/schemas/HealthStatus' }

  # --------------------------- Sessions -------------------------------------
  /sessions:
    post:
      tags: [sessions]
      summary: 登录（创建会话）
      operationId: createSession
      security: []
      parameters:
        - $ref: './_common.yaml#/components/parameters/RequestId'
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionCreated' }
        '202':
          description: 需要 MFA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaChallengeResponse' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/LoginRefused' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }
        '429': { $ref: './_common.yaml#/components/responses/RateLimited' }
    get:
      tags: [sessions]
      summary: Return all non-revoked, non-expired sessions for the authenticated user
      operationId: listSessions
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, device, issued_at]
                  properties:
                    id: { type: string }
                    ip: { type: string, nullable: true }
                    user_agent: { type: string, nullable: true }
                    device: { type: string }
                    last_seen_at: { type: string, nullable: true }
                    issued_at: { type: string }
                    current: { type: boolean, default: false }
                  description: Minimal session info returned to the frontend ProfilePage.
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  /sessions/current:
    get:
      tags: [sessions]
      summary: 取当前会话信息
      operationId: getCurrentSession
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
    delete:
      tags: [sessions]
      summary: 登出当前会话
      description: |
        终止当前会话：撤销 Keycloak 侧 SSO 会话、将该 refresh token 的 jti 加入黑名单、
        标记 DB 会话行 revoked。各步骤均为 best-effort，最终态为「会话已注销」，恒返回 204。
      operationId: revokeCurrentSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: 当前会话的 refresh token；用于撤销 KC 会话并拉黑其 jti。
      responses:
        '204': { description: 已登出 }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }

  /sessions/current/refresh:
    post:
      tags: [sessions]
      summary: 轮换 refresh token，换取新会话
      description: |
        单次性轮换：在兑换前先把所呈 refresh token 标记为「已用」（reuse 黑名单）。
        若该 token 已被标记，则判定为已轮换 token 的重放——视为安全事件，撤销该用户
        **全部**会话并以 `REFRESH_TOKEN_REUSED` 拒绝。

        Fail-secure：缓存不可达时拉黑写入失败（`REDIS_UNAVAILABLE`），拒绝刷新而非放行
        可能被重放的 token。

        依赖故障不消耗 token：Keycloak 不可达（`KEYCLOAK_UNAVAILABLE`，503）或返回异常
        （`KEYCLOAK_ERROR`，502）时会撤回「已用」标记，调用方可在依赖恢复后用**同一个**
        refresh token 重试，不会被误判为重放。Keycloak 明确拒绝（`invalid_grant` →
        `INVALID_CREDENTIALS`）或会话已超出空闲 / 绝对超时（`TOKEN_EXPIRED`）时返回 401，
        调用方应结束该会话并要求重新登录。
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: 轮换成功，返回新会话（含新 access/refresh token）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '502':
          description: Keycloak 返回异常（`KEYCLOAK_ERROR`）；refresh token 未被消耗，可重试。
          headers:
            X-Request-Id: { $ref: './_common.yaml#/components/headers/RequestIdHeader' }
          content:
            application/problem+json:
              schema: { $ref: './_common.yaml#/components/schemas/Error' }
        '503': { $ref: './_common.yaml#/components/responses/ServiceUnavailable' }

  /sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { $ref: './_common.yaml#/components/schemas/SessionId' }
    delete:
      tags: [sessions]
      summary: 杀指定会话（管理员）
      operationId: revokeSession
      responses:
        '204': { description: ok }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  /sessions/me:
    get:
      tags: [sessions]
      summary: 取调用方身份（由 bearer token 解析）
      description: |
        业务侧 BFF 在每次页面加载时调用，从 foundation 颁发的 JWT 反解出用户/租户档案。
        BFF **不应**信任客户端存储的身份信息，必须用此接口校验。
      operationId: getMe
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
    patch:
      tags: [sessions]
      summary: 自助更新当前用户档案（仅 display_name）
      description: |
        允许已认证的调用方**仅**修改自己的 `display_name`。
        身份解析方式与 `getMe` 相同：从 bearer token 反解出 `user_id` / `tenant_id`，
        目标用户**永远是调用方本人**，不接受路径参数，因此无法借此修改他人档案。
        持久化后会同步到 Keycloak（firstName）并发出 `foundation.identity.user.updated` 审计事件，
        返回体为带有最新名字的 `MeResponse`，便于 BFF/前端立即拿到权威值而无需等待 token 刷新。
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileSelfUpdate' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /sessions/service-account-token:
    post:
      tags: [sessions]
      summary: 签发短期、租户绑定、scope 限定的服务账号 token
      description: |
        当一个 service 需要为它派生的 workload（容器、批处理任务等）颁发凭证时，
        必须调用本接口换出**短 TTL + 单租户 + 最小 scope** 的 JWT，而**不允许**
        把自身 service-account token 透传给 workload。

        授权规则：
        * 调用方必须以 service principal 身份认证（M2 起强制）
        * `body.tenant_id` 必须等于调用方 token 的 tenant
        * 每个 scope 必须在 foundation scope catalogue 内（docs/CONVENTIONS.md §4）

        典型用例：agent-platform 的 agent-scheduler 为每个 OpenHands run
        派发 `ttl=sandbox_timeout`、`scopes=[llm-gateway.invoke, audit.write]`
        的 token，写入容器 env，run 结束即过期。
      operationId: issueServiceAccountToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountTokenRequest' }
      responses:
        '201':
          description: token 已签发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccountTokenResponse' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /sessions/{session_id}/mfa-verify:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { $ref: './_common.yaml#/components/schemas/SessionId' }
    post:
      tags: [mfa]
      summary: 提交 MFA 二步验证
      operationId: verifyMfa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  # --------------------------- Users ----------------------------------------
  /users:
    get:
      tags: [users]
      summary: 列租户用户
      operationId: listUsers
      parameters:
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - $ref: './_common.yaml#/components/parameters/Limit'
        - name: filter.status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: filter.email
          in: query
          schema: { type: string, format: email }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

    post:
      tags: [users]
      summary: 邀请创建用户
      operationId: inviteUser
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteUserRequest' }
      responses:
        '201':
          description: 用户已邀请
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: './_common.yaml#/components/schemas/UserId' }
    get:
      tags: [users]
      summary: 取用户详情
      description: |
        返回租户内用户的权威身份档案，包含必填的 `clearance`。内部授权服务可在
        网关完成服务认证并注入租户上下文后调用此接口，不得接受客户端自报等级。
      operationId: getUser
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
    patch:
      tags: [users]
      summary: 更新用户档案（JSON Merge Patch）
      description: |
        管理员更新租户用户档案。`clearance` 仅接受 L1-L5，且调用方不得修改自己的
        clearance；自助档案接口 `/sessions/me` 不接受该字段。
      operationId: updateUser
      parameters:
        - $ref: './_common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '412': { $ref: './_common.yaml#/components/responses/StaleVersion' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /users/{user_id}/freeze:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: './_common.yaml#/components/schemas/UserId' }
    post:
      tags: [users]
      summary: 紧急冻结用户（管理员）
      operationId: freezeUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        '204': { description: 已冻结 }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  /users/{user_id}/unfreeze:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: './_common.yaml#/components/schemas/UserId' }
    post:
      tags: [users]
      summary: 解冻用户
      operationId: unfreezeUser
      responses:
        '204': { description: 已解冻 }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  /users/{user_id}/password:reset:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { $ref: './_common.yaml#/components/schemas/UserId' }
    post:
      tags: [users]
      summary: 强制重置密码
      operationId: forcePasswordReset
      responses:
        '204': { description: 已发送重置邮件 }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  # --------------------------- MFA ------------------------------------------
  /mfa/methods:
    get:
      tags: [mfa]
      summary: 当前用户已绑定 MFA 方式
      operationId: listMfaMethods
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MfaMethod' }

  /mfa/methods/totp:enroll:
    post:
      tags: [mfa]
      summary: 绑定 TOTP（返回二维码 secret）
      operationId: enrollTotp
      responses:
        '201':
          description: 待用户确认验证码
          content:
            application/json:
              schema:
                type: object
                required: [secret, qr_url, enrollment_id]
                properties:
                  secret: { type: string }
                  qr_url: { type: string, format: uri }
                  enrollment_id: { type: string }

  /mfa/methods/totp:confirm:
    post:
      tags: [mfa]
      summary: 确认 TOTP 绑定
      operationId: confirmTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_id, code]
              properties:
                enrollment_id: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204': { description: 绑定成功 }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  # --------------------------- SSO ------------------------------------------
  /sso/providers:
    get:
      tags: [sso]
      summary: 列租户已配置 SSO providers
      operationId: listSsoProviders
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SsoProvider' }
    post:
      tags: [sso]
      summary: 新增 SSO provider（OIDC/SAML/AD/LDAP/钉钉企业/飞书/企微）
      operationId: createSsoProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSsoProviderRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SsoProvider' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  # --------------------------- Social ---------------------------------------
  /social/providers:
    get:
      tags: [social]
      summary: 当前租户开放的社交登录 provider 列表（前端登录页用）
      operationId: listEnabledSocialProviders
      security: []
      parameters:
        - name: tenant_hint
          in: query
          required: true
          schema: { $ref: './_common.yaml#/components/schemas/TenantId' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SocialProvider' }

  /social/providers:toggle:
    post:
      tags: [social]
      summary: 管理员开关某 social provider
      operationId: toggleSocialProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, enabled]
              properties:
                provider: { type: string, enum: [GOOGLE, GITHUB, MICROSOFT, WECHAT, QQ, DINGTALK_PERSONAL, FEISHU_PERSONAL, APPLE] }
                enabled: { type: boolean }
      responses:
        '204': { description: ok }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  # --------------------------- Policies -------------------------------------
  /policies/password:
    get:
      tags: [policies]
      summary: 取当前租户密码策略
      operationId: getPasswordPolicy
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordPolicy' }
    put:
      tags: [policies]
      summary: 更新密码策略（只可加严不可放宽）
      operationId: updatePasswordPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordPolicy' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordPolicy' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

# =============================================================================
# Components
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      $ref: './_common.yaml#/components/securitySchemes/bearerAuth'

  responses:
    SessionCreated:
      description: 会话已创建
      headers:
        X-Request-Id: { $ref: './_common.yaml#/components/headers/RequestIdHeader' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }

    LoginRefused:
      description: |
        登录被拒绝（401），按 `code` 区分原因，客户端应据此展示不同提示：
        - `FOUNDATION.IDENTITY.AUTH.INVALID_CREDENTIALS`：邮箱或密码错误（计入失败次数，可能触发锁定）。
        - `FOUNDATION.IDENTITY.AUTH.ACCOUNT_LOCKED`：失败次数过多，账号被临时锁定。
        - `FOUNDATION.IDENTITY.AUTH.ACCOUNT_SETUP_REQUIRED`：密码**正确**，但账号在 Keycloak 中仍有
          待完成的必需操作（密码过期 / 管理员要求重置密码 → `UPDATE_PASSWORD`，或 `VERIFY_EMAIL`、
          `CONFIGURE_TOTP` 等）。密码授权无法执行这些交互步骤，因此不签发会话；不计入失败次数。
          客户端不得提示「密码错误」，应引导用户通过设置 / 重置邮件完成更新或联系管理员。
        - `FOUNDATION.IDENTITY.AUTH.LOGIN_DENIED_RISK`：异常登录风险评估拒绝。
      headers:
        WWW-Authenticate:
          schema: { type: string }
        X-Request-Id: { $ref: './_common.yaml#/components/headers/RequestIdHeader' }
      content:
        application/problem+json:
          schema: { $ref: './_common.yaml#/components/schemas/Error' }
          examples:
            invalid_credentials:
              value:
                type: https://errors.foundation.example.com/foundation/identity/auth/invalid_credentials
                title: Invalid credentials
                status: 401
                code: FOUNDATION.IDENTITY.AUTH.INVALID_CREDENTIALS
                detail: invalid_grant
                user_message: 邮箱或密码不正确，请重试。
                instance: /api/identity/v1/sessions
                request_id: req_01J5XXXXXXXXXXXXXXXXXXXXXX
                timestamp: '2026-05-22T10:00:00Z'
            account_setup_required:
              value:
                type: https://errors.foundation.example.com/foundation/identity/auth/account_setup_required
                title: Account setup required
                status: 401
                code: FOUNDATION.IDENTITY.AUTH.ACCOUNT_SETUP_REQUIRED
                detail: Account is not fully set up (required actions pending)
                user_message: 账号需要先完成更新才能登录（例如密码已过期或管理员要求重置密码）。请使用设置邮件中的链接完成更新，或联系管理员为您发送密码重置邮件。
                instance: /api/identity/v1/sessions
                request_id: req_01J5XXXXXXXXXXXXXXXXXXXXXX
                timestamp: '2026-05-22T10:00:00Z'

  schemas:

    UserStatus:
      type: string
      enum: [ACTIVE, INVITED, SUSPENDED, LOCKED, DEACTIVATED, FROZEN]

    ClearanceLevel:
      type: string
      enum: [L1, L2, L3, L4, L5]
      description: 用户可访问的最高资源敏感级别；普通员工默认 L3。

    User:
      type: object
      required: [id, tenant_id, email, status, clearance, mfa_enabled, created_at, updated_at]
      properties:
        id: { $ref: './_common.yaml#/components/schemas/UserId' }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles:
          type: array
          items: { type: string, pattern: '^[A-Z_]+$' }
        clearance: { $ref: '#/components/schemas/ClearanceLevel' }
        last_login_at: { type: string, format: date-time, nullable: true }
        mfa_enabled: { type: boolean }
        external_id:
          type: string
          nullable: true
          description: 来自 SSO/SCIM 的外部 ID
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    InviteUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }
        clearance:
          allOf:
            - $ref: '#/components/schemas/ClearanceLevel'
          default: L3
        send_invite_email: { type: boolean, default: true }

    UpdateUserRequest:
      type: object
      properties:
        display_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles:
          type: array
          items: { type: string }
        clearance:
          allOf:
            - $ref: '#/components/schemas/ClearanceLevel'
          description: 管理员专用；调用方不得修改自己的访问级别。

    ProfileSelfUpdate:
      type: object
      additionalProperties: false
      description: |
        自助档案更新请求：调用方只能修改自己的 `display_name`。
        刻意收窄，不暴露 `status` / `roles` 等特权字段。
      properties:
        display_name: { type: string, maxLength: 200, nullable: true }

    Session:
      type: object
      required: [id, user_id, tenant_id, access_token, refresh_token, expires_at, issued_at]
      properties:
        id: { $ref: './_common.yaml#/components/schemas/SessionId' }
        user_id: { $ref: './_common.yaml#/components/schemas/UserId' }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [BEARER] }
        expires_at:
          type: string
          format: date-time
          description: |
            本次返回的 `access_token` 的过期时间（短期，默认 5 分钟），不是会话本身的寿命。
            会话在空闲超时 / 绝对超时或登出前一直有效，期间用 `refresh_token` 调
            `POST /sessions/current/refresh` 换取新的 access token。
        issued_at: { type: string, format: date-time }
        scopes:
          type: array
          items: { type: string }
        device_id: { type: string, nullable: true }

    CreateSessionRequest:
      oneOf:
        - $ref: '#/components/schemas/EmailPasswordCredential'
        - $ref: '#/components/schemas/OidcCredential'
        - $ref: '#/components/schemas/SamlCredential'
      discriminator:
        propertyName: method

    EmailPasswordCredential:
      type: object
      required: [method, email, password]
      properties:
        method: { type: string, enum: [EMAIL_PASSWORD] }
        email: { type: string, format: email }
        password: { type: string, format: password }
        device_id: { type: string, nullable: true }

    OidcCredential:
      type: object
      required: [method, provider, code]
      properties:
        method: { type: string, enum: [OIDC] }
        provider: { type: string }
        code: { type: string }
        redirect_uri: { type: string, format: uri }

    SamlCredential:
      type: object
      required: [method, provider, saml_response]
      properties:
        method: { type: string, enum: [SAML] }
        provider: { type: string }
        saml_response: { type: string }

    MeResponse:
      type: object
      required: [user_id, tenant_id, email, display_name, roles, clearance]
      properties:
        user_id: { $ref: './_common.yaml#/components/schemas/UserId' }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        email: { type: string, format: email }
        display_name: { type: string }
        roles:
          type: array
          items: { type: string }
        clearance: { $ref: '#/components/schemas/ClearanceLevel' }
        mfa_enabled: { type: boolean, default: false }
        locale: { type: string, default: zh-CN }

    ServiceAccountTokenRequest:
      type: object
      required: [tenant_id, subject, scopes]
      properties:
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        subject:
          type: string
          pattern: ^[a-z0-9._:-]+$
          minLength: 3
          maxLength: 128
          description: 调用方自命名的 workload 标识，进 JWT sub 与审计日志
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, description: foundation scope catalogue (docs/CONVENTIONS.md §4) }
        audience:
          type: string
          pattern: ^[a-z0-9-]+$
          minLength: 1
          maxLength: 64
          default: foundation
        ttl_seconds: { type: integer, minimum: 60, maximum: 86400, default: 3600 }

    ServiceAccountTokenResponse:
      type: object
      required:
        [access_token, token_type, expires_at, issued_at, tenant_id, subject, scopes, audience, jti]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [BEARER] }
        expires_at: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        subject: { type: string }
        scopes:
          type: array
          items: { type: string }
        audience: { type: string }
        jti:
          type: string
          pattern: '^jti_[0-9A-Z]{26}$'
          description: 唯一 token id；调用 revoke 接口可吊销

    MfaChallengeResponse:
      type: object
      required: [challenge_id, methods, expires_at]
      properties:
        challenge_id: { type: string }
        methods:
          type: array
          items: { type: string, enum: [TOTP, SMS_OTP, WEBAUTHN, PUSH] }
        expires_at: { type: string, format: date-time }

    MfaVerifyRequest:
      type: object
      required: [challenge_id, method, code]
      properties:
        challenge_id: { type: string }
        method: { type: string, enum: [TOTP, SMS_OTP, WEBAUTHN, PUSH] }
        code: { type: string }

    MfaMethod:
      type: object
      required: [id, kind, enrolled_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [TOTP, SMS_OTP, WEBAUTHN, PUSH] }
        label: { type: string, nullable: true }
        enrolled_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }

    SsoProvider:
      type: object
      required: [id, kind, name, enabled, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [OIDC, SAML, AD, LDAP, DINGTALK_ENTERPRISE, FEISHU_ENTERPRISE, WECOM] }
        name: { type: string }
        enabled: { type: boolean }
        config:
          type: object
          additionalProperties: true
          description: 各 kind 的字段不同；敏感字段如 client_secret 写入后不返回
        created_at: { type: string, format: date-time }

    CreateSsoProviderRequest:
      type: object
      required: [kind, name, config]
      properties:
        kind: { type: string, enum: [OIDC, SAML, AD, LDAP, DINGTALK_ENTERPRISE, FEISHU_ENTERPRISE, WECOM] }
        name: { type: string }
        config:
          type: object
          additionalProperties: true

    SocialProvider:
      type: object
      required: [provider, enabled]
      properties:
        provider:
          type: string
          enum: [GOOGLE, GITHUB, MICROSOFT, WECHAT, QQ, DINGTALK_PERSONAL, FEISHU_PERSONAL, APPLE]
        enabled: { type: boolean }
        login_url: { type: string, format: uri }

    PasswordPolicy:
      type: object
      required: [min_length, require_upper, require_lower, require_digit, require_symbol, max_age_days, history_size, max_failed_attempts, lockout_minutes]
      properties:
        min_length: { type: integer, minimum: 8, maximum: 128 }
        require_upper: { type: boolean }
        require_lower: { type: boolean }
        require_digit: { type: boolean }
        require_symbol: { type: boolean }
        max_age_days: { type: integer, minimum: 1, maximum: 365 }
        history_size: { type: integer, minimum: 1, maximum: 24 }
        max_failed_attempts: { type: integer, minimum: 3, maximum: 10 }
        lockout_minutes: { type: integer, minimum: 5, maximum: 1440 }
        breach_check_enabled:
          type: boolean
          description: 集成 HaveIBeenPwned 等口令泄露库
