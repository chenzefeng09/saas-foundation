# =============================================================================
# DLP + Classification Service API — dlp-classification-v1
# =============================================================================
# 5 级资源分级（L1-L5）+ 权威用户 clearance + 读/下载强制检查
# =============================================================================

openapi: 3.1.0

info:
  title: DLP + Classification Service API
  version: 1.0.0
  description: |
    资源分级（L1_PUBLIC → L5_SECRET）+ DLP 拦截。用户密级由 Identity
    服务权威管理；DLP 只按认证上下文中的 user_id 查询，不接受客户端自报密级。
    详见 [docs/design/dlp-classification-v1.md](../../docs/design/dlp-classification-v1.md)。

servers:
  - url: https://api.example.com/api/dlp/v1
  - url: http://localhost:8007/api/dlp/v1

security:
  - bearerAuth: []

tags:
  - name: labels
    description: 资源等级标签
  - name: check
    description: DLP 检查（download / upload / external_send / copy）
  - name: rules
    description: DLP 规则与敏感词样本
  - name: scanner
    description: 异步扫描任务
  - name: incidents
    description: DLP 拦截事件
  - name: downgrade
    description: 等级降级审批（4 眼）
  - name: health

paths:

  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: './_common.yaml#/components/schemas/HealthStatus' }

  # --------------------------- Labels ---------------------------------------
  /core/classification:get:
    get:
      tags: [labels]
      operationId: getResourceLabel
      parameters:
        - name: resource_type
          in: query
          required: true
          schema: { type: string }
        - name: resource_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [sensitivity, tags, downgradable]
                properties:
                  sensitivity: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
                  tags: { type: array, items: { type: string } }
                  downgradable: { type: boolean }

  /core/classification:tag:
    post:
      tags: [labels]
      operationId: setResourceLabel
      description: 仅受信 SERVICE/ADMIN 管理调用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resource_type, resource_id, sensitivity]
              properties:
                resource_type: { type: string }
                resource_id: { type: string }
                sensitivity: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
                tags: { type: array, items: { type: string } }
                reason: { type: string }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, sensitivity, tagged]
                properties:
                  id: { type: string }
                  sensitivity: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
                  tagged: { type: boolean }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  # --------------------------- Checks ---------------------------------------
  /core/check:read:
    post:
      tags: [check]
      summary: 读取前强制检查；用户和密级均由服务端上下文解析
      operationId: checkResourceRead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceCheckRequest' }
      responses:
        '200':
          description: 决策结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlpCheckResponse' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '503': { $ref: './_common.yaml#/components/responses/ServiceUnavailable' }

  /core/check:download:
    post:
      tags: [check]
      summary: 下载或生成预签名 URL 前强制检查
      operationId: checkResourceDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ResourceCheckRequest'
                - type: object
                  properties:
                    destination: { type: string, default: laptop }
      responses:
        '200':
          description: 决策结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlpCheckResponse' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '503': { $ref: './_common.yaml#/components/responses/ServiceUnavailable' }

  /core/scan:
    post:
      tags: [check]
      summary: 按规则扫描内容，返回判定；仅 SERVICE/ADMIN 调用会写资源标签
      operationId: scanContent
      description: |
        任何带租户上下文（`X-Tenant-Id`）的调用方都可扫描；命中一律记 DLP 事件
        （check_type=SCAN）。只有可信 SERVICE/ADMIN 调用才会把命中的最高级别写入或
        升级为 (resource_type, resource_id) 的分级标签（只升不降，新标签不低于未分级
        默认级别）。其他 actor（如经 tool-broker 扫描自身工具调用的沙箱 worker）只拿
        判定、不改标签。`action`：无命中 ALLOW；最高 L2/L3 为 SCAN_REQUIRED；L4 及以上
        为 QUARANTINE。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content, resource_type, resource_id]
              properties:
                content: { type: string }
                resource_type: { type: string }
                resource_id: { type: string }
      responses:
        '200':
          description: 扫描判定
          content:
            application/json:
              schema:
                type: object
                required: [hits, max_sensitivity, action]
                properties:
                  hits:
                    type: array
                    items:
                      type: object
                      properties:
                        rule_id: { type: string }
                        rule_name: { type: string }
                        keyword: { type: string }
                        sensitivity: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
                  max_sensitivity: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
                  action: { type: string, enum: [ALLOW, SCAN_REQUIRED, QUARANTINE] }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  # --------------------------- Rules ----------------------------------------
  /rules:
    get:
      tags: [rules]
      operationId: listDlpRules
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DlpRule' }
    post:
      tags: [rules]
      operationId: createDlpRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DlpRule' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlpRule' }

  # --------------------------- Scanner --------------------------------------
  /scanner/jobs:
    post:
      tags: [scanner]
      summary: 入扫描队列（异步）
      operationId: enqueueScannerJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_id]
              properties:
                resource_type: { type: string }
                resource_id: { type: string }
                priority: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        '202':
          description: 已入队
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }

  /scanner/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [scanner]
      operationId: getScannerJob
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScannerJob' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  # --------------------------- Incidents ------------------------------------
  /incidents:
    get:
      tags: [incidents]
      operationId: listDlpIncidents
      parameters:
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - $ref: './_common.yaml#/components/parameters/Limit'
        - name: filter.type
          in: query
          schema:
            type: string
            enum: [UNAUTHORIZED_READ, DOWNLOAD_BLOCKED, EXTERNAL_SEND_BLOCKED, SCAN_MATCH_L4PLUS, UPLOAD_BLOCKED]
        - name: filter.status
          in: query
          schema: { type: string, enum: [OPEN, RESOLVED, FALSE_POSITIVE] }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DlpIncident' }

  # --------------------------- Downgrade ------------------------------------
  /downgrade-requests:
    post:
      tags: [downgrade]
      summary: 申请资源降级（L4→L3 / L5→L4）；强制 4 眼审批
      operationId: requestDowngrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, resource_id, target_level, reason]
              properties:
                resource_type: { type: string }
                resource_id: { type: string }
                target_level: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
                reason: { type: string, minLength: 20 }
      responses:
        '201':
          description: 已入审批
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DowngradeRequest' }

  /downgrade-requests/{req_id}/approve:
    parameters:
      - name: req_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [downgrade]
      operationId: approveDowngrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DowngradeRequest' }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      $ref: './_common.yaml#/components/securitySchemes/bearerAuth'

  schemas:

    ResourceLabel:
      type: object
      required: [resource_type, resource_id, level, source, set_at]
      properties:
        resource_type: { type: string }
        resource_id: { type: string }
        level: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
        source: { type: string, enum: [USER, SCANNER, IMPORTED, INHERITED] }
        set_by: { type: string }
        reason: { type: string, nullable: true }
        set_at: { type: string, format: date-time }
        last_scanned_at: { type: string, format: date-time, nullable: true }

    ResourceCheckRequest:
      type: object
      additionalProperties: false
      required: [resource_type, resource_id]
      properties:
        resource_type: { type: string }
        resource_id: { type: string }

    DlpCheckResponse:
      type: object
      required: [allowed, sensitivity]
      properties:
        allowed: { type: boolean }
        sensitivity: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
        reason: { type: string, nullable: true }

    DlpRule:
      type: object
      required: [id, name, action_pattern, condition, effect]
      properties:
        id: { type: string }
        name: { type: string }
        action_pattern: { type: string, example: 'EXTERNAL_SEND|DOWNLOAD' }
        condition:
          type: object
          description: '条件 DSL，含 sensitivity / user_clearance / time / ip / recipient_domain 等'
        effect: { type: string, enum: [ALLOW, DENY, ALLOW_WITH_WATERMARK, REQUIRE_APPROVAL] }
        priority: { type: integer, default: 100 }
        enabled: { type: boolean, default: true }
        created_at: { type: string, format: date-time }

    ScannerJob:
      type: object
      required: [id, resource_type, resource_id, status, enqueued_at]
      properties:
        id: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        status: { type: string, enum: [QUEUED, SCANNING, COMPLETED, FAILED] }
        priority: { type: integer }
        enqueued_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        matched_rules:
          type: array
          items: { type: string }
        recommended_level: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        error: { type: string, nullable: true }

    DlpIncident:
      type: object
      required: [id, type, user_id, resource_id, occurred_at, status]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [UNAUTHORIZED_READ, DOWNLOAD_BLOCKED, EXTERNAL_SEND_BLOCKED, SCAN_MATCH_L4PLUS, UPLOAD_BLOCKED]
        user_id: { $ref: './_common.yaml#/components/schemas/UserId' }
        resource_type: { type: string }
        resource_id: { type: string }
        rule_id: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
        status: { type: string, enum: [OPEN, RESOLVED, FALSE_POSITIVE] }
        resolved_by: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }

    DowngradeRequest:
      type: object
      required: [id, resource_id, target_level, requested_by, status, created_at]
      properties:
        id: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        current_level: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
        target_level: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
        reason: { type: string }
        requested_by: { $ref: './_common.yaml#/components/schemas/UserId' }
        approvers_required: { type: integer, default: 2 }
        approvals:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string }
              decision: { type: string, enum: [APPROVE, REJECT] }
              at: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED] }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
