# =============================================================================
# Spectral ruleset — saas-foundation OpenAPI 强制规则
# =============================================================================
# 跑法：make lint（或 make lint-one SVC=<service>）
# CI 强制：任何规则触发 error → 阻断合并
# =============================================================================

extends:
  - spectral:oas      # OpenAPI 标准合规
  - spectral:asyncapi # 异步契约（webhook 用）

formats:
  - oas3_1

rules:

  # --------------------------------------------------------------------------
  # CONVENTIONS §2.2 URL 路径：/api/<service>/<version>/<resource>
  # The version is part of the server URL (/api/identity/v1, /scim/v2), as in
  # _template.yaml, and appears in the URL once: paths do not repeat it.
  # --------------------------------------------------------------------------
  foundation-server-url-version:
    description: Server URLs must end in the API version, e.g. /api/identity/v1 (CONVENTIONS §2.2)
    severity: error
    given:
      - $.servers[*].url
      - $.paths[*].servers[*].url
      - $.paths[*][get,put,post,delete,options,head,patch,trace].servers[*].url
    then:
      function: pattern
      functionOptions:
        match: '/v[0-9]+$'

  foundation-paths-unversioned:
    description: Paths must not start with a version; the server URL carries it (CONVENTIONS §2.2)
    severity: error
    given: $.paths
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: '^/v[0-9]+(/|$)'

  # --------------------------------------------------------------------------
  # CONVENTIONS §2.8 JSON 字段命名 snake_case
  # --------------------------------------------------------------------------
  foundation-property-snake-case:
    description: JSON property names must be snake_case
    severity: error
    given: $.components.schemas..properties[*]~
    then:
      function: pattern
      functionOptions:
        match: '^[a-z_][a-z0-9_]*$'

  # --------------------------------------------------------------------------
  # CONVENTIONS §2.8 枚举 UPPER_SNAKE_CASE
  # 例外：合规模式标识符使用小写 + 数字（compliance-v1 §3 single source of truth）
  # --------------------------------------------------------------------------
  foundation-enum-upper-snake:
    description: Enum values must be UPPER_SNAKE_CASE (except compliance mode identifiers)
    severity: warn
    given: $.components.schemas..enum[*]
    then:
      function: pattern
      functionOptions:
        match: '^([A-Z][A-Z0-9_]*|equal_protection_[34]|finance_jrt0071|pipl|gdpr|hipaa|soc2|iso27001)$'

  # --------------------------------------------------------------------------
  # 错误码格式 FOUNDATION.<SVC>.<CAT>.<NAME> 四段
  # --------------------------------------------------------------------------
  foundation-error-code-format:
    description: Error code must match FOUNDATION.<SVC>.<CAT>.<NAME> 4-segment pattern
    severity: error
    given: $.components.schemas..code.pattern
    then:
      function: pattern
      functionOptions:
        match: '\\^\\[A-Z\\]\\[A-Z_\\]\\+\\\\\\.\\[A-Z\\]\\[A-Z_\\]\\+\\\\\\.\\[A-Z\\]\\[A-Z_\\]\\+\\\\\\.\\[A-Z\\]\\[A-Z_\\]\\+\\$'

  # --------------------------------------------------------------------------
  # 所有 path 必须有 operationId（SDK 生成必需）
  # Built-in rules are re-levelled with a bare severity. An object such as
  # `{severity: error}` declares a new rule instead, which needs given/then,
  # and Spectral then refuses to load the whole ruleset.
  # --------------------------------------------------------------------------
  operation-operationId: error

  operation-operationId-unique: error

  # --------------------------------------------------------------------------
  # operationId 必须 camelCase（生成 SDK 方法名）
  # --------------------------------------------------------------------------
  foundation-operation-id-camel-case:
    description: operationId must be camelCase (used for SDK method generation)
    severity: error
    given: $.paths.*[get,put,post,delete,options,head,patch,trace].operationId
    then:
      function: pattern
      functionOptions:
        match: '^[a-z][a-zA-Z0-9]*$'

  # --------------------------------------------------------------------------
  # 4xx / 5xx 响应必须用 $ref 引用 _common（README 铁律 3：不允许 inline 定义错误 body）
  # An error response is one of _common.yaml's responses, or an inline response
  # (to give it a description of its own) whose RFC 9457 body is _common.yaml's
  # Error or ValidationError. Both rules read the spec as written: in the
  # resolved document every $ref has already been replaced by its target.
  # --------------------------------------------------------------------------
  foundation-error-responses-must-be-ref:
    description: A 4xx/5xx response $ref must point at _common.yaml's responses
    severity: error
    resolved: false
    given: $.paths[*][get,put,post,delete,options,head,patch,trace].responses[?(@property.match(/^[45]/) && @.$ref)].$ref
    then:
      function: pattern
      functionOptions:
        match: '^\./_common\.yaml#/components/responses/[A-Za-z]+$'

  # HEAD answers have no body, so they are left out.
  foundation-error-inline-body:
    description: An inline 4xx/5xx response must have an application/problem+json body that $refs _common.yaml's Error or ValidationError (errors.md §2)
    severity: error
    resolved: false
    given: $.paths[*][get,put,post,delete,options,patch,trace].responses[?(@property.match(/^[45]/) && !@.$ref)]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [content]
          properties:
            content:
              type: object
              required: [application/problem+json]
              additionalProperties: false
              properties:
                application/problem+json:
                  type: object
                  required: [schema]
                  properties:
                    schema:
                      type: object
                      required: [$ref]
                      properties:
                        $ref:
                          type: string
                          pattern: '^\./_common\.yaml#/components/schemas/(Error|ValidationError)$'

  # --------------------------------------------------------------------------
  # 所有非公开 path 必须声明 security
  # 公开路径：/healthz、/readyz、/metrics、登录端点（需显式 security: []）
  # --------------------------------------------------------------------------
  foundation-security-required:
    description: All non-public paths must require auth; declare security explicitly
    severity: error
    given: $.paths..[get,put,post,delete,options,head,patch].security
    then:
      function: defined

  # --------------------------------------------------------------------------
  # 所有时间字段必须 format: date-time
  # --------------------------------------------------------------------------
  foundation-time-format:
    description: Time fields must declare format date-time
    severity: warn
    given: $.components.schemas..properties[?(@property.match(/_(at|time|date)$/))]
    then:
      field: format
      function: enumeration
      functionOptions:
        values: [date-time, date]

  # --------------------------------------------------------------------------
  # ID 字段必须有 pattern
  # --------------------------------------------------------------------------
  foundation-id-pattern:
    description: ID fields must declare ULID pattern
    severity: warn
    given: $.components.schemas..properties[?(@property == 'id' || @property.match(/_id$/))]
    then:
      field: pattern
      function: defined

  # --------------------------------------------------------------------------
  # info 块必填
  # --------------------------------------------------------------------------
  info-contact: warn
  info-description: error
  info-license: warn

  # --------------------------------------------------------------------------
  # 标准 spectral 规则保留
  # --------------------------------------------------------------------------
  no-$ref-siblings: error

  oas3-server-not-example.com: hint    # 模板里用 example.com 是有意的
