# =============================================================================
# Billing Service API — billing-v1
# =============================================================================
# 双模式：私有化（quota+invoice）/ SaaS（+Stripe 订阅）
# 抽象：PaymentProvider / InvoiceGenerator / TaxCalculator
# =============================================================================

openapi: 3.1.0

info:
  title: Billing Service API
  version: 1.0.0
  description: |
    计费：套餐 / 订阅 / 配额 / 用量 / 发票。双模式：
    - 私有化默认（OfflineProvider + 中国电子发票）
    - SaaS（Stripe + Stripe Tax）通过 feature flag 启用
    详见 [docs/design/billing-v1.md](../../docs/design/billing-v1.md)。

servers:
  - url: https://api.example.com/api/billing/v1
  - url: http://localhost:8016/api/billing/v1

security:
  - bearerAuth: []

tags:
  - name: plans
  - name: subscriptions
  - name: quotas
  - name: usage
  - name: invoices
  - name: webhooks
  - name: health

paths:

  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: './_common.yaml#/components/schemas/HealthStatus' }

  # --------------------------- Plans ----------------------------------------
  /plans:
    get:
      tags: [plans]
      operationId: listPlans
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
    post:
      tags: [plans]
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tier, quotas, price_monthly_usd]
              properties:
                name: { type: string }
                tier: { type: string }
                quotas:
                  type: object
                  additionalProperties: { type: integer }
                price_monthly_usd: { type: number }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  # --------------------------- Subscriptions --------------------------------
  /subscriptions:
    get:
      tags: [subscriptions]
      operationId: listSubscriptions
      parameters:
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - name: filter.status
          in: query
          schema: { type: string, enum: [TRIAL, ACTIVE, PAST_DUE, CANCELED, SUSPENDED] }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Subscription' }
    post:
      tags: [subscriptions]
      operationId: createSubscription
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubscriptionRequest' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /subscriptions/change-plan:
    post:
      tags: [subscriptions]
      summary: 变更当前租户活跃订阅的套餐（租户来自 X-Tenant-Id 上下文）
      operationId: changeCurrentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_plan_id]
              properties:
                new_plan_id: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /subscriptions/cancel:
    post:
      tags: [subscriptions]
      summary: 取消当前租户的活跃订阅（status → CANCELED，租户来自上下文）
      operationId: cancelCurrentSubscription
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  /subscriptions/{sub_id}:
    parameters:
      - name: sub_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [subscriptions]
      operationId: getSubscription
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  /subscriptions/{sub_id}/change-plan:
    parameters:
      - name: sub_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [subscriptions]
      summary: 升降级（自动按比例计费）
      operationId: changePlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_plan_id]
              properties:
                new_plan_id: { type: string }
                proration: { type: boolean, default: true }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /subscriptions/{sub_id}/cancel:
    parameters:
      - name: sub_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [subscriptions]
      operationId: cancelSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                immediate: { type: boolean, default: false }
                reason: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /subscriptions/current:
    get:
      tags: [subscriptions]
      summary: Get the current tenant's active subscription
      operationId: getCurrentSubscription
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  # --------------------------- Quotas ---------------------------------------
  /quotas:
    get:
      tags: [quotas]
      operationId: listQuotas
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Quota' }

  /quota/check:
    post:
      tags: [quotas]
      summary: Check whether the current tenant may use more of a quota dimension
      operationId: checkQuota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dimension]
              properties:
                dimension: { type: string }
                requested: { type: integer, default: 1 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  # --------------------------- Usage ----------------------------------------
  /usage:
    get:
      tags: [usage]
      summary: 查询用量
      operationId: queryUsage
      parameters:
        - name: dimension
          in: query
          schema: { type: string }
        - name: time_start
          in: query
          schema: { type: string, format: date-time }
        - name: time_end
          in: query
          schema: { type: string, format: date-time }
        - name: granularity
          in: query
          schema: { type: string, enum: [HOUR, DAY, MONTH] }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        ts: { type: string, format: date-time }
                        amount: { type: integer }
                  total: { type: integer }

  /quota/usage:
    post:
      tags: [usage]
      summary: Record usage of a quota dimension for the current tenant
      operationId: reportUsage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dimension, amount]
              properties:
                dimension: { type: string }
                amount: { type: number }
                description: { type: string, default: '' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  # --------------------------- Invoices -------------------------------------
  /invoices:
    get:
      tags: [invoices]
      operationId: listInvoices
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
    post:
      tags: [invoices]
      summary: Generate Invoice
      operationId: generateInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { type: object, additionalProperties: true }
                due_days: { type: integer, default: 30 }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /invoices/{invoice_id}:
    parameters:
      - name: invoice_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [invoices]
      operationId: getInvoice
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  /invoices/{invoice_id}/pdf:
    parameters:
      - name: invoice_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [invoices]
      operationId: downloadInvoicePdf
      responses:
        '200':
          description: ok
          content:
            application/pdf:
              schema: { type: string, format: binary }

  # --------------------------- Webhooks (Stripe / Aliypay / WeChatPay) ------
  /webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [stripe, alipay, wechatpay] }
    post:
      tags: [webhooks]
      summary: 接收支付 provider webhook
      operationId: receivePaymentWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged: { type: boolean }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      $ref: './_common.yaml#/components/securitySchemes/bearerAuth'

  schemas:

    Plan:
      type: object
      required: [id, name, kind, billing_cycle, price_amount, currency]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [FREE, PRO, BUSINESS, ENTERPRISE, CUSTOM] }
        billing_cycle: { type: string, enum: [MONTHLY, YEARLY, ONE_TIME] }
        price_amount: { type: integer, description: '最小货币单位（分 / cent）' }
        currency: { type: string, example: USD }
        included_quotas:
          type: object
          additionalProperties: { type: integer }
        features:
          type: array
          items: { type: string }
        active: { type: boolean, default: true }

    Subscription:
      type: object
      required: [id, tenant_id, plan_id, status, current_period_start, current_period_end]
      properties:
        id: { type: string }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        plan_id: { type: string }
        status: { type: string, enum: [TRIAL, ACTIVE, PAST_DUE, CANCELED, SUSPENDED] }
        provider: { type: string, enum: [OFFLINE, STRIPE, ALIPAY, WECHATPAY] }
        provider_subscription_id: { type: string, nullable: true }
        current_period_start: { type: string, format: date-time }
        current_period_end: { type: string, format: date-time }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        canceled_at: { type: string, format: date-time, nullable: true }
        grace_period_ends_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreateSubscriptionRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: string }
        mode: { type: string, default: private }

    Quota:
      type: object
      required: [dimension, hard_limit, used, period]
      properties:
        dimension: { type: string, example: llm_tokens }
        unit: { type: string }
        hard_limit: { type: integer }
        soft_limit: { type: integer }
        used: { type: integer }
        period: { type: string, enum: [MONTH, DAY, HOUR, LIFETIME] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }

    Invoice:
      type: object
      required: [id, tenant_id, status, currency, total_amount, period_start, period_end, created_at]
      properties:
        id: { type: string }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        subscription_id: { type: string }
        number: { type: string }
        status: { type: string, enum: [DRAFT, OPEN, PAID, VOID, UNCOLLECTIBLE] }
        currency: { type: string }
        subtotal_amount: { type: integer }
        tax_amount: { type: integer }
        total_amount: { type: integer }
        line_items:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              quantity: { type: integer }
              unit_amount: { type: integer }
              amount: { type: integer }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        due_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        pdf_s3_key: { type: string, nullable: true }
        china_einvoice_id: { type: string, nullable: true, description: 航天信息 / 百望接口返回 }
        created_at: { type: string, format: date-time }
