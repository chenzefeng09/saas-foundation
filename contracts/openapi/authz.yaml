# =============================================================================
# Authorization Service API — authz-v1
# =============================================================================
# 配套设计：docs/design/authz-v1.md + docs/design/opa-bundle-v1.md
# 核心：RBAC（90% 场景） + OPA(ABAC)（复杂策略）
# =============================================================================

openapi: 3.1.0

info:
  title: Authorization Service API
  version: 1.0.0
  description: |
    授权服务：RBAC + OPA(ABAC) 双轨。性能敏感路径（`/check`）同步走 gRPC，
    本 spec 暴露 REST 镜像端点供前端 / 调试用。详见 [docs/design/authz-v1.md](../../docs/design/authz-v1.md)。

servers:
  - url: https://api.example.com/api/authz/v1
  - url: http://localhost:8002/api/authz/v1

security:
  - bearerAuth: []

tags:
  - name: check
    description: 权限检查（同步）
  - name: roles
    description: 角色 CRUD
  - name: permissions
    description: 权限定义
  - name: bindings
    description: 角色绑定（user/team/ou ↔ role）
  - name: policies
    description: OPA ABAC 策略管理
  - name: health

paths:

  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: './_common.yaml#/components/schemas/HealthStatus' }

  # --------------------------- Check ----------------------------------------
  /check:
    post:
      tags: [check]
      summary: 权限检查（单条）
      description: |
        SDK 内部走 gRPC；REST 端点用于调试 / 前端 UI 试算。
        每次决策都执行 RBAC、Identity 用户 clearance、DLP 资源 sensitivity
        与 OPA 策略；任一权威属性不可用时失败闭合。请求 context 中的
        clearance/classification/sensitivity 不作为授权依据。
      operationId: checkPermission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckRequest' }
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckResponse' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }

  /check:batch:
    post:
      tags: [check]
      summary: 批量权限检查
      operationId: batchCheckPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checks]
              properties:
                checks:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/CheckRequest' }
      responses:
        '200':
          description: 批量结果（顺序对应）
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/CheckResponse' }
        '400': { $ref: './_common.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }

  /list-accessible-ids:
    post:
      tags: [check]
      summary: 列出用户对某 resource_type 有权限的 ID 集合（搜索过滤用）
      operationId: listAccessibleIds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, resource_type, action]
              properties:
                user_id: { $ref: './_common.yaml#/components/schemas/UserId' }
                resource_type: { type: string }
                action: { type: string }
                max: { type: integer, default: 10000, maximum: 100000 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [ids, complete, all_in_tenant, clearance_filtered]
                properties:
                  ids:
                    type: array
                    items: { type: string }
                  complete:
                    type: boolean
                    description: false 表示超 max 截断，需逐资源调用 /check
                  all_in_tenant:
                    type: boolean
                    description: 仅表示 RBAC 为租户范围，不豁免资源等级过滤
                  clearance_filtered:
                    type: boolean
                    enum: [false]
                    description: 此接口只枚举 RBAC 候选，调用方仍必须执行等级过滤

  # --------------------------- Roles ----------------------------------------
  /roles:
    get:
      tags: [roles]
      operationId: listRoles
      parameters:
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - $ref: './_common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [roles]
      operationId: createRole
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }

  /roles/{role_id}:
    parameters:
      - name: role_id
        in: path
        required: true
        schema: { $ref: './_common.yaml#/components/schemas/RoleId' }
    get:
      tags: [roles]
      operationId: getRole
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
    patch:
      tags: [roles]
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
    delete:
      tags: [roles]
      operationId: deleteRole
      responses:
        '204': { description: ok }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '409':
          description: 角色仍有 binding；先解绑
          content:
            application/problem+json:
              schema: { $ref: './_common.yaml#/components/schemas/Error' }

  # --------------------------- Permissions ----------------------------------
  /permissions:
    get:
      tags: [permissions]
      summary: 列底座 + 业务层注册的权限定义
      operationId: listPermissions
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }

  # --------------------------- Bindings -------------------------------------
  /bindings:
    get:
      tags: [bindings]
      summary: 列角色绑定（默认只列 ACTIVE）
      description: |
        默认只返回 ACTIVE 绑定——即 `/check` 实际采纳、当前生效的授权。
        已撤销（REVOKED）与已过期（EXPIRED）的绑定是审计历史，只有在
        `filter.status` 显式请求时才返回；每条记录都带 `status` 与
        `revoked_at` / `revoked_by` / `revoked_reason`，调用方据此区分
        "当前授权" 与 "历史记录"。按 `id` 升序游标分页。
      operationId: listBindings
      parameters:
        - name: filter.principal_kind
          in: query
          schema: { $ref: '#/components/schemas/PrincipalKind' }
        - name: filter.principal_id
          in: query
          schema: { type: string }
        - name: filter.role_id
          in: query
          schema: { $ref: './_common.yaml#/components/schemas/RoleId' }
        - name: filter.status
          in: query
          description: |
            逗号分隔的生命周期状态，如 `filter.status=REVOKED` 或
            `filter.status=ACTIVE,REVOKED`。缺省 = `ACTIVE`；三种全选 = 不按状态过滤。
            非法值（含小写、空值）→ 422 `FOUNDATION.AUTHZ.INPUT.VALIDATION_FAILED`。
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items: { $ref: '#/components/schemas/RoleBindingStatus' }
            default: [ACTIVE]
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - $ref: './_common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RoleBinding' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }
    post:
      tags: [bindings]
      operationId: createBinding
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBindingRequest' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /bindings/{binding_id}:
    parameters:
      - name: binding_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/RoleBindingId' }
    delete:
      tags: [bindings]
      summary: 撤销绑定（软撤销，幂等）
      description: |
        不物理删除：写入 `revoked_at` / `revoked_by` / `revoked_reason`，绑定立即
        失效，从默认列表消失，仍可用 `GET /bindings?filter.status=REVOKED` 查到。
        对已撤销的绑定重复调用返回 204，原撤销记录不变。撤销是终态——
        再次授权须新建绑定（新的 id）。
      operationId: deleteBinding
      responses:
        '204': { description: 已撤销（或此前已撤销） }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  # --------------------------- OPA Policies ---------------------------------
  /policies:
    get:
      tags: [policies]
      summary: 列租户的 OPA policies
      operationId: listPolicies
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Policy' }
    post:
      tags: [policies]
      summary: 上传 / 更新 OPA Rego 策略
      operationId: upsertPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertPolicyRequest' }
      responses:
        '201':
          description: 已入 bundle 待发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /policies/{policy_id}/simulate:
    parameters:
      - name: policy_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [policies]
      summary: 干跑（不影响生产）
      operationId: simulatePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckRequest' }
      responses:
        '200':
          description: 模拟决策
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckResponse' }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      $ref: './_common.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    CheckRequest:
      type: object
      required: [user_id, action, resource_type]
      properties:
        user_id: { $ref: './_common.yaml#/components/schemas/UserId' }
        action: { type: string, example: 'document:read' }
        resource_type: { type: string, example: 'document' }
        resource_id: { type: string }
        context:
          type: object
          additionalProperties: true
          description: ABAC 上下文（ip / time / device）；安全等级由服务端权威解析

    CheckResponse:
      type: object
      required: [allowed, decision_path]
      properties:
        allowed: { type: boolean }
        decision_path:
          type: string
          enum: [RBAC_HIT, OPA_HIT, DEFAULT_DENY, KILL_SWITCH_DENY]
        matched_role:
          type: string
          nullable: true
        matched_policy:
          type: string
          nullable: true
        deny_reason:
          type: string
          nullable: true
        latency_ms: { type: number }

    Role:
      type: object
      required: [id, tenant_id, name, scope, permissions, created_at]
      properties:
        id: { $ref: './_common.yaml#/components/schemas/RoleId' }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        name: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        description: { type: string, nullable: true }
        scope:
          type: string
          enum: [TENANT, ORG_UNIT, TEAM, RESOURCE]
        permissions:
          type: array
          items: { type: string }
        is_system: { type: boolean, description: 系统内置不可改 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRoleRequest:
      type: object
      required: [name, scope, permissions]
      properties:
        name: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        description: { type: string }
        scope: { type: string, enum: [TENANT, ORG_UNIT, TEAM, RESOURCE] }
        permissions:
          type: array
          items: { type: string }

    UpdateRoleRequest:
      type: object
      properties:
        description: { type: string, nullable: true }
        permissions:
          type: array
          items: { type: string }

    Permission:
      type: object
      required: [name, description, requires_policy]
      properties:
        name: { type: string, example: 'document:read' }
        description: { type: string }
        owner_service: { type: string, example: 'identity' }
        requires_policy: { type: boolean, description: true → 必走 OPA }

    RoleBindingId:
      type: string
      pattern: '^rbd_[0-9A-Z]{26}$'

    PrincipalKind:
      type: string
      enum: [USER, TEAM, ORG_UNIT, API_KEY, SERVICE_ACCOUNT]

    ScopeKind:
      type: string
      enum: [TENANT, ORG_UNIT, TEAM, RESOURCE, GLOBAL_SYSTEM]

    RoleBindingStatus:
      type: string
      enum: [ACTIVE, EXPIRED, REVOKED]
      description: |
        绑定在响应生成时刻的生命周期状态，互斥、按序判定（与 `/check` 同一规则）：
        `REVOKED` = `revoked_at` 非空（撤销优先于过期）；
        `EXPIRED` = 未撤销但 `expires_at` 已过；
        `ACTIVE` = 其余，即当前生效、`/check` 采纳的绑定。

    RoleBinding:
      type: object
      required:
        - id
        - tenant_id
        - principal_kind
        - principal_id
        - role_id
        - scope_kind
        - granted_at
        - granted_by
        - status
      properties:
        id: { $ref: '#/components/schemas/RoleBindingId' }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        principal_kind: { $ref: '#/components/schemas/PrincipalKind' }
        principal_id:
          type: string
          description: 主体 ID，前缀随 principal_kind（如 USER → `usr_…`）
        role_id: { $ref: './_common.yaml#/components/schemas/RoleId' }
        scope_kind: { $ref: '#/components/schemas/ScopeKind' }
        scope_id:
          type: string
          nullable: true
          description: scope_kind 非 TENANT / GLOBAL_SYSTEM 时的作用域对象 ID
        granted_at: { type: string, format: date-time }
        granted_by:
          type: string
          description: 授予者 user_id；系统引导写入的绑定为 `BOOTSTRAP`
        grant_reason: { type: string, nullable: true }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: JIT 提权用；过期后 status = EXPIRED，不再参与鉴权
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: 撤销时间；null = 未撤销
        revoked_by: { type: string, nullable: true }
        revoked_reason: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/RoleBindingStatus' }

    CreateBindingRequest:
      type: object
      additionalProperties: false
      required: [principal_kind, principal_id, role_id]
      properties:
        principal_kind: { $ref: '#/components/schemas/PrincipalKind' }
        principal_id: { type: string, minLength: 1, maxLength: 64 }
        role_id: { $ref: './_common.yaml#/components/schemas/RoleId' }
        scope_kind:
          type: string
          enum: [TENANT, ORG_UNIT, TEAM, RESOURCE, GLOBAL_SYSTEM]
          default: TENANT
        scope_id: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        grant_reason: { type: string, maxLength: 500, nullable: true }

    Policy:
      type: object
      required: [id, name, rego, status, version, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        rego: { type: string, description: Rego 源码 }
        status:
          type: string
          enum: [DRAFT, ACTIVE, DEPRECATED]
        version: { type: integer }
        rollout_stage:
          type: string
          enum: [SHADOW, CANARY_10, CANARY_50, FULL]
          description: opa-bundle-v1 灰度阶段
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpsertPolicyRequest:
      type: object
      required: [name, rego]
      properties:
        name: { type: string }
        rego: { type: string }
        rollout_stage:
          type: string
          enum: [SHADOW, CANARY_10, CANARY_50, FULL]
          default: SHADOW
