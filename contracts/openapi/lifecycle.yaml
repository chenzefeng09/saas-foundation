# =============================================================================
# Lifecycle Service API — lifecycle-v1
# =============================================================================
# Retention / Recycle Bin / Backup / Legal Hold / 销毁证明（sole holder）
# =============================================================================

openapi: 3.1.0

info:
  title: Lifecycle Service API
  version: 1.0.0
  description: |
    资源生命周期：保留策略、软删除回收站、备份恢复编排、Legal Hold、销毁证明（owner）。
    详见 [docs/design/lifecycle-v1.md](../../docs/design/lifecycle-v1.md)。

servers:
  - url: https://api.example.com/api/lifecycle/v1
  - url: http://localhost:8006/api/lifecycle/v1

security:
  - bearerAuth: []

tags:
  - name: retention
    description: 保留策略
  - name: recycle-bin
    description: 软删回收站
  - name: legal-hold
    description: 法律保留
  - name: approvals
    description: 四眼审批（立即硬删、解除法律保留需第二人批准）
  - name: backups
    description: 备份与恢复演练
  - name: destruction-certs
    description: 销毁证明（PDF）
  - name: health

paths:

  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: './_common.yaml#/components/schemas/HealthStatus' }

  # --------------------------- Retention ------------------------------------
  /retention-policies:
    get:
      tags: [retention]
      operationId: listRetentionPolicies
      parameters:
        - name: filter.resource_type
          in: query
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RetentionPolicy' }
    post:
      tags: [retention]
      operationId: createRetentionPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionPolicy' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPolicy' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  # --------------------------- Recycle Bin ----------------------------------
  /recycle-bin:
    get:
      tags: [recycle-bin]
      operationId: listRecycledItems
      parameters:
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - $ref: './_common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RecycledItem' }

  /recycle-bin/{bin_id}:restore:
    parameters:
      - name: bin_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [recycle-bin]
      summary: Restore a recycle-bin entry
      description: |
        The authenticated caller (`X-User-Id`) is recorded as the restorer; a request
        without a user is refused with 403. No body is needed.
      operationId: restoreItem
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                restored_by:
                  type: string
                  nullable: true
                  deprecated: true
                  description: Ignored. The restorer is always the caller.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [restored]
                properties:
                  restored: { type: boolean }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /recycle-bin/{bin_id}:hard-delete:
    parameters:
      - name: bin_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [recycle-bin]
      summary: Ask for a recycle-bin entry to be hard-deleted now
      description: |
        Hard-deleting takes two people (lifecycle-v1 §4.4). This call destroys nothing:
        it opens an approval request for the entry and answers 202. A second user
        carries it out with `POST /approval-requests/{approval_id}/approve` within the
        approval window (30 minutes by default) and is the witness the destruction
        certificate names. While the entry has a request pending, asking again returns
        that request, whoever opened it. An entry that is already destroyed returns 200.
        Refused with 409 while a legal hold covers the resource.

        The authenticated caller (`X-User-Id`) is recorded as the requester and, once a
        second user approves, as the one who destroyed it; a request without a user is
        refused with 403. No body is needed.
      operationId: purgeItem
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                destroyed_by:
                  type: string
                  nullable: true
                  deprecated: true
                  description: Ignored. The requester is always the caller.
                witness_user_id:
                  type: string
                  nullable: true
                  deprecated: true
                  description: Ignored. The witness is the user who approves the request.
      responses:
        '202':
          description: Waiting for a second user to approve
          content:
            application/json:
              schema:
                type: object
                required: [destroyed, approval_request]
                properties:
                  destroyed: { type: boolean, enum: [false] }
                  approval_request: { $ref: '#/components/schemas/ApprovalRequest' }
        '200':
          description: Already destroyed
          content:
            application/json:
              schema:
                type: object
                required: [destroyed]
                properties:
                  destroyed: { type: boolean, enum: [true] }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  # --------------------------- Legal Hold -----------------------------------
  /legal-holds:
    get:
      tags: [legal-hold]
      operationId: listLegalHolds
      parameters:
        - name: filter.resource_type
          in: query
          description: Only holds on resources of this type (exact match; ANDed with the other filters)
          schema: { type: string }
        - name: filter.resource_id
          in: query
          description: Only holds on this resource (exact match; ANDed with the other filters)
          schema: { type: string }
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - $ref: './_common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LegalHold' }
    post:
      tags: [legal-hold]
      operationId: createLegalHold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLegalHoldRequest' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [hold_id, status]
                properties:
                  hold_id: { type: string }
                  status: { type: string, enum: [ACTIVE] }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /legal-holds/{hold_id}:release:
    parameters:
      - name: hold_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [legal-hold]
      summary: Ask for a legal hold to be released
      description: |
        Releasing a hold takes two people (lifecycle-v1 §4.4). This call releases
        nothing: it opens an approval request for the hold and answers 202. A second
        user carries it out with `POST /approval-requests/{approval_id}/approve` within
        the approval window (30 minutes by default). While the hold has a request
        pending, asking again returns that request, whoever opened it. A hold that is
        already released returns 200.

        The authenticated caller (`X-User-Id`) is recorded as the requester and, once a
        second user approves, as the releaser; a request without a user is refused with
        403. No body is needed.
      operationId: releaseLegalHold
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                released_by:
                  type: string
                  nullable: true
                  deprecated: true
                  description: Ignored. The requester is always the caller.
      responses:
        '202':
          description: Waiting for a second user to approve
          content:
            application/json:
              schema:
                type: object
                required: [released, approval_request]
                properties:
                  released: { type: boolean, enum: [false] }
                  approval_request: { $ref: '#/components/schemas/ApprovalRequest' }
        '200':
          description: Already released
          content:
            application/json:
              schema:
                type: object
                required: [released]
                properties:
                  released: { type: boolean, enum: [true] }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  # --------------------------- Four-eyes approvals --------------------------
  /approval-requests:
    get:
      tags: [approvals]
      summary: List approval requests
      description: Newest first. A pending request whose window has closed is listed as EXPIRED.
      operationId: listApprovalRequests
      parameters:
        - name: filter.status
          in: query
          description: Only requests in this status (ANDed with the other filters)
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED] }
        - name: filter.operation
          in: query
          description: Only requests for this operation (ANDed with the other filters)
          schema: { type: string, enum: [HARD_DELETE, RELEASE_LEGAL_HOLD] }
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - $ref: './_common.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ApprovalRequest' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /approval-requests/{approval_id}:
    parameters:
      - name: approval_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [approvals]
      operationId: getApprovalRequest
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  /approval-requests/{approval_id}/approve:
    parameters:
      - name: approval_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [approvals]
      summary: Approve a request, which carries it out
      description: |
        The authenticated caller (`X-User-Id`) approves as the second person, and the
        operation takes effect in this same call: the recycle-bin entry is destroyed,
        with the caller as the certificate's witness and the requester as the one who
        destroyed it, or the legal hold is released, with the requester as the releaser.
        No body.

        Refused with 403 when the caller is the requester (`SELF_APPROVAL_FORBIDDEN`) or
        no user is given, and with 409 when the request was already decided or its
        window has closed (`APPROVAL_NOT_PENDING`). The operation's own checks run again:
        a legal hold placed on the resource meanwhile refuses the destruction with 409,
        and an entry restored meanwhile with 404; either way the request stays pending.
      operationId: approveRequest
      responses:
        '200':
          description: Approved and carried out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }

  /approval-requests/{approval_id}/reject:
    parameters:
      - name: approval_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [approvals]
      summary: Reject a request
      description: |
        Nothing is destroyed or released. Anyone may reject, the requester too, which
        withdraws the request; the caller (`X-User-Id`) is recorded as who decided, and
        a request without a user is refused with 403. Refused with 409 when the request
        was already decided or its window has closed. No body.
      operationId: rejectRequest
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '409': { $ref: './_common.yaml#/components/responses/Conflict' }

  # --------------------------- Backups --------------------------------------
  /backups:
    get:
      tags: [backups]
      operationId: listBackups
      parameters:
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - $ref: './_common.yaml#/components/parameters/Limit'
        - name: filter.kind
          in: query
          schema: { type: string, enum: [POSTGRES_FULL, POSTGRES_INCREMENTAL, CLICKHOUSE, VELERO_SNAPSHOT, MINIO] }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Backup' }

  /backups/{backup_id}/restore:
    parameters:
      - name: backup_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [backups]
      summary: 触发恢复（生产环境必走演练环境验证）
      operationId: restoreBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_environment]
              properties:
                target_environment:
                  type: string
                  enum: [DRILL, STAGING, PRODUCTION]
                witness_id:
                  type: string
                  description: PRODUCTION 强制 4 眼
      responses:
        '202':
          description: 已入队
          content:
            application/json:
              schema:
                type: object
                properties:
                  restore_job_id: { type: string }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  # --------------------------- Destruction Certificates ---------------------
  /destruction-certificates:
    get:
      tags: [destruction-certs]
      operationId: listDestructionCertificates
      parameters:
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - name: filter.resource_id
          in: query
          schema: { type: string }
        - name: filter.time_start
          in: query
          schema: { type: string, format: date-time }
        - name: filter.time_end
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DestructionCertificate' }

  /destruction-certificates/{cert_id}:
    parameters:
      - name: cert_id
        in: path
        required: true
        schema: { type: string, pattern: '^dcert_[0-9A-Z]{26}$' }
    get:
      tags: [destruction-certs]
      operationId: getDestructionCertificate
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestructionCertificate' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  /destruction-certificates/{cert_id}/pdf:
    parameters:
      - name: cert_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [destruction-certs]
      summary: 下载 PDF（由 data-protection 渲染 + crypto 签名）
      operationId: downloadDestructionCertificatePdf
      responses:
        '200':
          description: ok
          content:
            application/pdf:
              schema: { type: string, format: binary }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      $ref: './_common.yaml#/components/securitySchemes/bearerAuth'

  schemas:

    RetentionPolicy:
      type: object
      required: [id, resource_type, retention_days, post_retention_action]
      properties:
        id: { type: string }
        resource_type: { type: string }
        retention_days: { type: integer, minimum: 1 }
        post_retention_action:
          type: string
          enum: [SOFT_DELETE, HARD_DELETE, ARCHIVE_S3, ARCHIVE_OFFLINE]
        compliance_mode_override:
          type: object
          additionalProperties:
            type: integer
          description: 合规模式 → 强制保留期（取最严）

    RecycledItem:
      type: object
      required: [id, resource_type, resource_id, deleted_at, expires_at]
      properties:
        id: { type: string, description: 'bin_id: what :restore and :hard-delete take' }
        resource_type: { type: string }
        resource_id: { type: string }
        deleted_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: when the retention sweep hard-deletes it

    LegalHold:
      type: object
      required: [id, resource_type, resource_id, reason, placed_at]
      properties:
        id: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        reason: { type: string }
        placed_at: { type: string, format: date-time }

    CreateLegalHoldRequest:
      type: object
      required: [resource_type_id, resource_id, reason]
      properties:
        resource_type_id: { type: string }
        resource_id: { type: string }
        reason: { type: string, minLength: 10 }
        case_reference: { type: string, minLength: 3, nullable: true }

    ApprovalRequest:
      type: object
      description: |
        A hard-delete or legal-hold release waiting for, or decided by, a second user
        (lifecycle-v1 §4.4).
      required: [id, operation, target_id, status, requested_by, requested_at, expires_at, decided_by, decided_at]
      properties:
        id: { type: string, pattern: '^apr_[0-9A-Z]{26}$' }
        operation: { type: string, enum: [HARD_DELETE, RELEASE_LEGAL_HOLD] }
        target_id:
          type: string
          description: the recycle-bin entry (bin_id) to destroy, or the legal hold (hold_id) to release
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED]
          description: EXPIRED once the window closes with nobody deciding
        requested_by:
          type: string
          description: who asked; once approved, recorded as who destroyed or released
        requested_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: the approval window closes then
        decided_by:
          type: string
          nullable: true
          description: who approved or rejected; for HARD_DELETE the approver is the certificate's witness
        decided_at: { type: string, format: date-time, nullable: true }

    Backup:
      type: object
      required: [id, kind, created_at, size_bytes, location, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [POSTGRES_FULL, POSTGRES_INCREMENTAL, CLICKHOUSE, VELERO_SNAPSHOT, MINIO] }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer }
        location: { type: string, description: s3:// or volume path }
        kms_key_id: { type: string }
        residency_region: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, ARCHIVED] }
        expires_at: { type: string, format: date-time, nullable: true }

    DestructionCertificate:
      type: object
      required: [id, tenant_id, resource_type, resource_ids, destruction_method, destroyed_at, signature_algorithm, signature]
      properties:
        id: { type: string, pattern: '^dcert_[0-9A-Z]{26}$' }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        resource_type: { type: string }
        resource_ids:
          type: array
          items: { type: string }
        destruction_method:
          type: string
          enum: [CRYPTO_KEY_DESTROY, DOD_5220_22_M, NIST_800_88_CLEAR, NIST_800_88_PURGE]
        destroyed_at: { type: string, format: date-time }
        executor_id: { $ref: './_common.yaml#/components/schemas/UserId' }
        witness_id:
          type: string
          nullable: true
        kek_id_destroyed: { type: string, nullable: true }
        pdf_s3_key: { type: string }
        signature_algorithm: { type: string, enum: [ECDSA_P256_SHA256, SM2_SM3, ED25519] }
        signature: { type: string }
        tsa_token: { type: string, nullable: true }
        audit_event_id: { $ref: './_common.yaml#/components/schemas/AuditEventId' }
