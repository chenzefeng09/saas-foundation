# =============================================================================
# Audit Service API — audit-v1
# =============================================================================
# 不可篡改审计：OTel → ClickHouse → S3 WORM；hash chain + SM2/ECDSA 签名 + TSA
# 配套设计：docs/design/audit-v1.md
# =============================================================================

openapi: 3.1.0

info:
  title: Audit Service API
  version: 1.0.0
  description: |
    审计服务：事件写入（业务用 SDK 走异步 outbox）、查询、导出、完整性校验。
    详见 [docs/design/audit-v1.md](../../docs/design/audit-v1.md)。

servers:
  - url: https://api.example.com/api/audit/v1
  - url: http://localhost:8005/api/audit/v1

security:
  - bearerAuth: []

tags:
  - name: events
    description: 审计事件写入与查询
  - name: chain
    description: Hash chain 完整性
  - name: export
    description: 审计导出（CSV/PDF + 数字签名）
  - name: schemas
    description: 事件 schema 注册
  - name: health

paths:

  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: './_common.yaml#/components/schemas/HealthStatus' }

  /events:
    post:
      tags: [events]
      summary: 直接写入审计事件（业务通常用 SDK + outbox）
      operationId: writeAuditEvent
      parameters:
        - $ref: './_common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteAuditEventRequest' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEvent' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /events:query:
    post:
      tags: [events]
      summary: Query the caller's tenant's audit events
      description: |
        `tenant_id` in the body must be the authenticated tenant (403 otherwise).
      operationId: queryAuditEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditQuery' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEvent' }
                      total_estimate: { type: integer, nullable: true }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }

  /events/{event_id}:
    parameters:
      - name: event_id
        in: path
        required: true
        schema: { $ref: './_common.yaml#/components/schemas/AuditEventId' }
    get:
      tags: [events]
      operationId: getAuditEvent
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEvent' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }

  /events:export:
    post:
      tags: [events]
      summary: 同步导出审计事件（CSV / JSON，封顶 10000 行）
      operationId: exportEvents
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
      requestBody:
        required: true
        description: 复用 /events:query 的过滤条件（body 中的 cursor 字段被忽略，分页由服务端内部处理）
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditQuery' }
      responses:
        '200':
          description: '导出文件（附带 Content-Disposition: attachment）'
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: { type: string }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '503': { $ref: './_common.yaml#/components/responses/ServiceUnavailable' }

  /events:verify-integrity:
    post:
      tags: [chain]
      summary: Verify the hash chain and Merkle batch signatures of the caller's tenant's events
      description: |
        Checks a window of at most `limit` events of the tenant's chains (one per
        service), in the order the worker chained them. Send the response's
        `next_cursor` as `cursor` to check the events after the window; a run of
        calls checks every event once. Every Merkle batch the window touches is
        checked whole. Send `cursor` or `from_event_id`, not both (422).
        `tenant_id` must be the authenticated tenant (403 otherwise).
      operationId: verifyChainRange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string }
                service: { type: string, nullable: true }
                cursor:
                  type: string
                  nullable: true
                  description: The `next_cursor` of the previous call. The window resumes right after it.
                from_event_id:
                  type: string
                  nullable: true
                  deprecated: true
                  description: For old clients. The window starts at this event, in chain order; 404 if the tenant has no such event.
                limit: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required:
                  - valid
                  - events_checked
                  - signatures_verified
                  - signatures_failed
                  - tsa_present
                  - message
                properties:
                  valid: { type: boolean }
                  events_checked: { type: integer }
                  first_break_event_id: { type: string, nullable: true }
                  signatures_verified: { type: integer }
                  signatures_failed: { type: integer }
                  signatures_unverifiable:
                    type: integer
                    default: 0
                    description: Merkle batches the tenant's events cannot verify, proven neither intact nor tampered.
                  tsa_present: { type: integer }
                  message: { type: string }
                  next_cursor:
                    type: string
                    nullable: true
                    description: Send as `cursor` to check the events after this window; null once none are left.
                  chains:
                    type: array
                    description: Each chain (one per service) with events in the window.
                    items:
                      type: object
                      required: [service, start, first_event_id, last_event_id, events_checked]
                      properties:
                        service: { type: string }
                        start:
                          type: string
                          enum: [genesis, previous_event, predecessor_not_retained]
                          description: |
                            What first_event_id follows. `previous_event`: the chain's
                            last event before the window, checked against it. `genesis`:
                            nothing; it is the chain's first event. `predecessor_not_retained`:
                            an event no longer stored (the chain's earlier events expired or
                            were removed), so it is checked against its own prev_hash.
                        first_event_id: { type: string }
                        last_event_id: { type: string }
                        events_checked: { type: integer }
        '401': { $ref: './_common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
        '422': { $ref: './_common.yaml#/components/responses/ValidationFailed' }
        '503': { $ref: './_common.yaml#/components/responses/ServiceUnavailable' }

  /export:
    post:
      tags: [export]
      summary: 导出审计（CSV / PDF + 数字签名）
      operationId: exportAudit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '202':
          description: 异步任务已入队
          content:
            application/json:
              schema:
                type: object
                required: [export_id]
                properties:
                  export_id: { type: string }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  /export/{export_id}:
    parameters:
      - name: export_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [export]
      operationId: getExportStatus
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [export_id, status]
                properties:
                  export_id: { type: string }
                  status:
                    type: string
                    enum: [QUEUED, RUNNING, READY, FAILED]
                  download_url: { type: string, format: uri, nullable: true }
                  signature_url: { type: string, format: uri, nullable: true }
                  expires_at: { type: string, format: date-time, nullable: true }

  /schemas:
    get:
      tags: [schemas]
      summary: 列已注册事件 schema
      operationId: listEventSchemas
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventSchema' }
    post:
      tags: [schemas]
      summary: 注册新事件 schema（业务模块启动时调）
      operationId: registerEventSchema
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventSchema' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSchema' }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      $ref: './_common.yaml#/components/securitySchemes/bearerAuth'

  schemas:

    AuditQuery:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        service: { type: string, nullable: true }
        event_type: { type: string, nullable: true }
        event_types:
          type: array
          items: { type: string }
          nullable: true
        severity:
          allOf:
            - $ref: './_common.yaml#/components/schemas/Severity'
          nullable: true
        outcome: { type: string, nullable: true }
        actor_user_id: { type: string, nullable: true }
        resource_type: { type: string, nullable: true }
        resource_id: { type: string, nullable: true }
        session_id: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        occurred_from: { type: string, format: date-time, nullable: true }
        occurred_to: { type: string, format: date-time, nullable: true }
        limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        cursor: { type: string, nullable: true }

    AuditEvent:
      type: object
      required: [id, tenant_id, event_type, severity, actor, resource, action, occurred_at, hash, prev_hash]
      properties:
        id: { $ref: './_common.yaml#/components/schemas/AuditEventId' }
        tenant_id: { $ref: './_common.yaml#/components/schemas/TenantId' }
        event_type:
          type: string
          example: 'foundation.identity.user.frozen'
          description: 四段式 `foundation.<service>.<entity>.<action>`
        severity: { $ref: './_common.yaml#/components/schemas/Severity' }
        actor:
          type: object
          properties:
            type: { type: string, enum: [USER, SERVICE, SYSTEM, EXTERNAL] }
            id: { type: string }
            ip: { type: string, nullable: true }
            user_agent: { type: string, nullable: true }
        resource:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
            classification: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
        action: { type: string }
        outcome:
          type: string
          enum: [SUCCESS, FAILURE, PARTIAL]
        payload:
          type: object
          additionalProperties: true
          description: 业务字段；PII 自动脱敏
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        # 完整性
        hash:
          type: string
          description: SHA-256(prev_hash + canonical(event))
        prev_hash: { type: string }
        signature:
          type: string
          description: ECDSA P-256 / SM2 签名（base64）
        tsa_token:
          type: string
          nullable: true
          description: RFC 3161 TSA token（合规模式开启）
        # 追溯
        request_id: { type: string, nullable: true }
        trace_id: { type: string, nullable: true }

    WriteAuditEventRequest:
      type: object
      required: [event_type, actor, action]
      properties:
        event_type: { type: string }
        severity: { $ref: './_common.yaml#/components/schemas/Severity' }
        actor:
          type: object
          properties:
            type: { type: string, enum: [USER, SERVICE, SYSTEM, EXTERNAL] }
            id: { type: string }
        resource:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
            classification: { $ref: './_common.yaml#/components/schemas/SensitivityLevel' }
        action: { type: string }
        outcome: { type: string, enum: [SUCCESS, FAILURE, PARTIAL] }
        payload:
          type: object
          additionalProperties: true
        occurred_at: { type: string, format: date-time }

    ExportRequest:
      type: object
      required: [format, time_start, time_end]
      properties:
        format: { type: string, enum: [CSV, PDF, NDJSON] }
        time_start: { type: string, format: date-time }
        time_end: { type: string, format: date-time }
        filter:
          type: object
          additionalProperties: true
        include_signatures:
          type: boolean
          default: true
        purpose:
          type: string
          enum: [REGULATORY_AUDIT, INTERNAL_AUDIT, INCIDENT, LEGAL_DISCOVERY]
          description: 出口理由（强制；审计自身入审）

    EventSchema:
      type: object
      required: [event_type, version, owner_service, payload_schema]
      properties:
        event_type: { type: string }
        version: { type: integer, default: 1 }
        owner_service: { type: string }
        description: { type: string }
        payload_schema:
          type: object
          description: JSON Schema draft 2020-12
        required_audit:
          type: boolean
          description: true → 业务必须发，缺则告警
        retention_days:
          type: integer
          description: 缺则取合规模式默认
