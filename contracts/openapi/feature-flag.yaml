# =============================================================================
# Feature Flag Service API — feature-flag-v1
# =============================================================================
# 薄封装 Unleash，注入租户 / 用户上下文
# =============================================================================

openapi: 3.1.0

info:
  title: Feature Flag Service API
  version: 1.0.0
  description: |
    Feature Flag：基于 Unleash 自托管，注入租户上下文 + 套餐门 + 灰度 / kill switch。
    业务通过 SDK 调用 `is_enabled(flag, user_ctx)`；本 REST 端点用于管理控制台。

servers:
  - url: https://api.example.com/api/feature-flag/v1
  - url: http://localhost:8014/api/feature-flag/v1

security:
  - bearerAuth: []

tags:
  - name: flags
  - name: evaluation
  - name: health

paths:

  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: './_common.yaml#/components/schemas/HealthStatus' }

  /flags:
    get:
      tags: [flags]
      operationId: listFlags
      parameters:
        - $ref: './_common.yaml#/components/parameters/Cursor'
        - $ref: './_common.yaml#/components/parameters/Limit'
        - name: filter.enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_common.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Flag' }
    post:
      tags: [flags]
      operationId: createFlag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Flag' }
      responses:
        '201':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flag' }

  /flags/{flag_key}:
    parameters:
      - name: flag_key
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9_.-]*$' }
    get:
      tags: [flags]
      operationId: getFlag
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flag' }
        '404': { $ref: './_common.yaml#/components/responses/NotFound' }
    patch:
      tags: [flags]
      operationId: updateFlag
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/Flag' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flag' }
    delete:
      tags: [flags]
      operationId: deleteFlag
      responses:
        '204': { description: ok }

  /flags/{flag_key}/kill-switch:
    parameters:
      - name: flag_key
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [flags]
      summary: 紧急 kill（立即全量关闭）
      operationId: killFlag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flag' }
        '403': { $ref: './_common.yaml#/components/responses/Forbidden' }

  /evaluate:
    post:
      tags: [evaluation]
      summary: 评估 flag（前端 / 业务调；SDK 内部用）
      operationId: evaluateFlag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flag_key]
              properties:
                flag_key: { type: string }
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
                  variant: { type: string, nullable: true }
                  reason: { type: string }

  /evaluate:batch:
    post:
      tags: [evaluation]
      operationId: batchEvaluateFlags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flag_keys]
              properties:
                flag_keys:
                  type: array
                  items: { type: string }
                context:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    variant: { type: string, nullable: true }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      $ref: './_common.yaml#/components/securitySchemes/bearerAuth'

  schemas:

    Flag:
      type: object
      required: [key, enabled, strategies]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_.-]*$' }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        strategies:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [DEFAULT, USER_IDS, PERCENTAGE_ROLLOUT, TENANT_TIER, COMPLIANCE_MODE, CUSTOM]
              parameters:
                type: object
                additionalProperties: true
        variants:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              weight: { type: integer }
              payload:
                type: object
                additionalProperties: true
        tags:
          type: array
          items: { type: string }
        owner_team: { type: string }
        kill_switch_active: { type: boolean, default: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
