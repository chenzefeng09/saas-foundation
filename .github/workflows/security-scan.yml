# =============================================================================
# Security scan — SAST / SCA / Secret / License / Container / SBOM
# 每个 PR + push to main 都跑；Critical/High 阻断合并
# 详见 docs/CONVENTIONS.md §10.2 + docs/errors.md §SSDLC
# =============================================================================

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * 1"  # 每周一夜里跑全量
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ===========================================================================
  # 1) Semgrep — SAST
  # ===========================================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        env:
          SEMGREP_RULES: >-
            p/python
            p/fastapi
            p/owasp-top-ten
            p/jwt
            p/secrets
            p/sql-injection
            tools/ci/semgrep-rules.yaml
        run: |
          semgrep --config "${SEMGREP_RULES}" \
            --severity=ERROR --severity=WARNING \
            --error \
            --sarif --output=semgrep.sarif \
            --exclude='tests/' --exclude='_template/' \
            .

      - name: Upload SARIF
        if: always()
        # PR(尤其非默认分支/fork)上传 code-scanning 结果受 GitHub 集成权限限制,
        # 失败不应阻断扫描 job —— 扫描结论以 Run Semgrep 步骤为准
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # ===========================================================================
  # 2) Trivy — SCA + Container scan + Misconfig
  # ===========================================================================
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem SCA
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "1"

      - name: Trivy misconfig (helm/k8s/docker)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"   # Misconfig 只警告，不阻断

      - name: Upload Trivy SARIFs
        if: always()
        # 同上:code-scanning 上传权限受限时不阻断 job
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .

  # ===========================================================================
  # 3) Gitleaks — Secret scan
  # ===========================================================================
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 全 history
      - uses: gitleaks/gitleaks-action@v2
        env:
          # v2 破坏性更新：扫描 PR 必须显式提供 GITHUB_TOKEN
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # config-path 输入已废弃，改用 env 指定配置文件路径
          GITLEAKS_CONFIG: tools/ci/gitleaks.toml

  # ===========================================================================
  # 4) License scan — 黑白名单（详见 docs/CONVENTIONS.md §10.2）
  # ===========================================================================
  license:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install pip-licenses + cyclonedx
        run: |
          pip install pip-licenses cyclonedx-bom
      - name: Scan each package
        run: |
          shopt -s nullglob
          fail=0
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            echo "::group::License scan: $name"
            cd "$pkg"
            if [ -f pyproject.toml ]; then
              pip install poetry -q
              poetry install --no-root --only main -q
              # --partial-match: allow-only 做子串匹配。PyPI classifier 元数据用全称
              # （"Apache Software License" / "MIT License" / "BSD License"…），与 SPDX 短
              # 标识精确匹配不上，会把 MIT/Apache/BSD 等许可型依赖全部误判。子串匹配后
              # "Apache" 命中 "Apache Software License" 等。fail-on（copyleft 黑名单）不受影响。
              # Unlicense：email-validator 用的公共领域等价许可，补入白名单。
              poetry run pip-licenses \
                --fail-on="GPL;AGPL;LGPL-2.0;LGPL-2.1;LGPL-3.0" \
                --allow-only="MIT;Apache;Apache-2.0;BSD;BSD-2-Clause;BSD-3-Clause;ISC;MPL-2.0;Python Software Foundation License;PSF;Public Domain;Unlicense" \
                --partial-match \
                --format=markdown --output-file=../../license-report-$name.md \
                || fail=1
            fi
            cd - > /dev/null
            echo "::endgroup::"
          done
          exit $fail

      - name: Upload license reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: license-report-*.md

  # ===========================================================================
  # 5) SBOM generation (CycloneDX)
  # ===========================================================================
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Generate SBOM
        run: |
          syft dir:. \
            -o cyclonedx-json=sbom.cdx.json \
            -o spdx-json=sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 90

      - name: Grype CVE scan against SBOM
        uses: anchore/scan-action@v4
        env:
          # CI runner 偶发拉不到最新漏洞库时,默认 5 天陈旧检查会硬失败;
          # 放宽年龄上限,让扫描用可用 DB 完成而非崩溃(仍每次尝试更新)
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: "168h"
        with:
          sbom: sbom.cdx.json
          severity-cutoff: high
          fail-build: true
          output-format: sarif

  # ===========================================================================
  # 6) Forbidden imports — 业务层不能直接 import 开源组件
  # ===========================================================================
  forbidden-imports:
    name: Forbidden Imports
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check business code does not import foundation backends
        run: |
          # 业务 service（packages/*/src/foundation_<svc>/services/）禁止直接 import 这些
          # 必须经底座 SDK 收口
          FORBIDDEN_PATTERN='from\s+(keycloak|litellm|clickhouse_driver|opensearchpy|hvac|unleash_client)|import\s+(keycloak|litellm|clickhouse_driver|opensearchpy|hvac|unleash_client)'
          if find packages -type f -name '*.py' -path '*/services/*' -exec grep -lE "$FORBIDDEN_PATTERN" {} + 2>/dev/null; then
            echo "::error::Business service code must not import third-party backends directly. Use foundation SDK."
            exit 1
          fi
          echo "OK"

  # ===========================================================================
  # 7) SET LOCAL / BYPASSRLS / superuser misuse scan
  # ===========================================================================
  rls-policy-scan:
    name: RLS Misuse Scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          # 危险:业务逻辑层(services/)直接设 RLS 上下文 / 绕过 RLS。
          # 合法位置:底座会话层 domain/db.py、adapters、foundation_common —— 这些不在 services/ 下,天然不被扫到。
          # 只扫 services/ 业务逻辑(与 Forbidden Imports job 同口径),并剔除注释/文档字符串行,
          # 避免把解释安全不变量的注释("SET LOCAL ..."反引号说明)误判为违规。
          hits=$(find packages -type f -name '*.py' -path '*/services/*' \
                   -not -path '*/_template/*' -print0 \
                 | xargs -0 grep -nE '(SET\s+LOCAL\s+app\.|BYPASSRLS|SUPERUSER)' 2>/dev/null \
                 | grep -vE ':[0-9]+:\s*#' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::SET LOCAL / BYPASSRLS / SUPERUSER must not appear in business services/. Use domain/db.py session scope, adapters, or foundation_common."
            exit 1
          fi
          echo "OK"
          echo "OK"
