# Gitleaks 配置 — saas-foundation
title = "saas-foundation gitleaks rules"

[extend]
useDefault = true

[[rules]]
id = "foundation-jwt-secret"
description = "JWT signing secret"
regex = '''(?i)(jwt[_-]?secret|signing[_-]?key)\s*[:=]\s*['"][A-Za-z0-9+/=]{32,}['"]'''
tags = ["secret", "jwt"]

[[rules]]
id = "foundation-db-conn"
description = "Hardcoded DB connection string with password"
regex = '''postgres(ql)?://[^:]+:[^@]+@[^/]+'''
tags = ["secret", "db"]

[allowlist]
paths = [
  '''\.gitleaks\.toml$''',
  '''^docs/.+\.md$''',
  '''^deploy/docker-compose/\.env\.example$''',
  '''^deploy/docker-compose/config/pgbouncer/userlist\.txt$''',
  '''^deploy/docker-compose/init/.+\.sql$''',
]
regexes = [
  '''(change_me|EXAMPLE|YOUR_.*_HERE|placeholder|dev-root-token)''',
]
