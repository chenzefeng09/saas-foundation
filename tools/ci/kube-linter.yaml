# kube-linter 配置 — 对渲染后的 Helm 输出做安全/最佳实践检查
# medium/large profile 严格执行；small profile 容忍部分警告

customChecks: []

checks:
  doNotAutoAddDefaults: false
  exclude:
    # 容忍 small profile 的某些设置
    - "default-service-account"          # 我们显式建了 SA，false positive
    - "unset-cpu-requirements"           # values 已配
    - "unset-memory-requirements"        # values 已配
    - "pdb-min-available"                # large 启用 HPA 时 Deployment 不渲染静态 replicas，
                                         # 该 check 误把 PDB.minAvailable 与默认副本数比较→false positive
  include:
    - "privileged-container"
    - "run-as-non-root"
    - "no-read-only-root-fs"
    - "no-rolling-update-strategy"
    - "writable-host-mount"
    - "host-network"
    - "host-pid"
    - "host-ipc"
    - "dangling-service"
    - "deprecated-service-account-field"
    - "drop-net-raw-capability"
    - "no-anti-affinity"                 # 仅 large/medium 关注
    - "no-extensions-v1beta"
    - "no-liveness-probe"
    - "no-readiness-probe"
    - "non-existent-service-account"
    - "privilege-escalation-container"
    - "required-annotation-email"
    - "sensitive-host-mounts"
    - "ssh-port"
    - "unsafe-proc-mount"
    - "unsafe-sysctls"
