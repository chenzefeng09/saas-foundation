[tool.poetry]
name = "foundation-feature-flag"
version = "1.0.0a1"
description = "SaaS Foundation — Feature Flag Service (Unleash wrapper)"
authors = ["SaaS Foundation Team <foundation@example.com>"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "foundation_feature_flag", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
greenlet = "^3.1.0"
opentelemetry-api = "^1.28.0"
opentelemetry-sdk = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-exporter-otlp = "^1.28.0"
structlog = "^24.4.0"
ulid-py = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
