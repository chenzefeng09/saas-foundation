[tool.poetry]
name = "foundation-storage"
version = "1.0.0a1"
description = "SaaS Foundation — Storage abstraction layer (boto3-based S3/MinIO client with tenant-scoped key layout, quota hooks, OTel)."
authors = ["SaaS Foundation Team <foundation@example.com>"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "foundation_storage", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"

pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
boto3 = "^1.35.0"
structlog = "^24.4.0"
opentelemetry-api = "^1.28.0"
ulid-py = "^1.1.0"
httpx = { extras = ["http2"], version = "^0.27.0" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
"boto3-stubs" = { extras = ["s3"], version = "^1.35.0" }

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","ASYNC","S","C4","PT","RUF"]
ignore = ["S101","B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S","PT011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ulid.*","boto3.*","botocore.*","sqlalchemy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra","--strict-markers","--strict-config",
  "--cov=foundation_storage","--cov-report=term-missing",
  "--cov-fail-under=80",
]
markers = [
  "unit: 纯单元测试",
  "integration: 需要真实 MinIO/S3",
]

[tool.coverage.run]
source = ["src/foundation_storage"]
branch = true
