[tool.poetry]
name = "foundation-llm-gateway"
version = "1.0.0a1"
description = "SaaS Foundation — LLM Gateway (LiteLLM wrapper)"
authors = ["SaaS Foundation Team <foundation@example.com>"]
packages = [{ include = "foundation_llm_gateway", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
httpx = "^0.27.0"
structlog = "^24.4.0"
ulid-py = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
