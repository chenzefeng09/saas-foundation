[tool.poetry]
name = "foundation-notification"
version = "1.0.0a1"
description = "SaaS Foundation — Notification Service (multi-channel: email, webhook, WebSocket, DingTalk, Feishu, WeCom)"
authors = ["SaaS Foundation Team <foundation@example.com>"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "foundation_notification", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = { extras = ["email"], version = "^2.9.0" }
pydantic-settings = "^2.6.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
greenlet = "^3.1.0"
httpx = { extras = ["http2"], version = "^0.27.0" }
jinja2 = "^3.1.0"
opentelemetry-api = "^1.28.0"
opentelemetry-sdk = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-exporter-otlp = "^1.28.0"
structlog = "^24.4.0"
ulid-py = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","ASYNC","S","C4","PT","RUF"]
ignore = ["S101","B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ulid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra","--strict-markers","--strict-config","--cov=foundation_notification","--cov-report=term-missing","--cov-fail-under=60"]
