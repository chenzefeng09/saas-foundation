[tool.poetry]
name = "foundation-security-ops"
version = "1.0.0a1"
description = "SaaS Foundation — Security Operations Service (SSDLC / Vulnerability SLA / SBOM / Incident Response)"
authors = ["SaaS Foundation Team <foundation@example.com>"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "foundation_security_ops", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = { extras = ["email"], version = "^2.9.0" }
pydantic-settings = "^2.6.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.14.0"
greenlet = "^3.1.0"
opentelemetry-api = "^1.28.0"
opentelemetry-sdk = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-instrumentation-sqlalchemy = "^0.49b0"
opentelemetry-exporter-otlp = "^1.28.0"
structlog = "^24.4.0"
ulid-py = "^1.1.0"

# Internal foundation packages (Phase 2: validate *_s3_key request body format
# via foundation-storage; query feature flag via foundation-feature-flag.
# Phase 4: DELETE endpoints route through foundation-lifecycle so the recycle
# bin owns the S3 cleanup window — see storage-v1 §6.2).
foundation-storage = { path = "../storage", develop = true }
foundation-feature-flag = { path = "../feature-flag", develop = true }
foundation-lifecycle = { path = "../lifecycle", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.27.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","ASYNC","S","C4","PT","RUF"]
ignore = ["S101","B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S","PT011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["foundation_storage.*", "foundation_feature_flag.*", "foundation_lifecycle.*", "ulid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# Bare `pytest` (the CI lint-and-test job) runs the unit tier only; the integration
# and rls-fuzz jobs pass tests/integration/ and tests/security/ explicitly.
testpaths = ["tests/unit"]
# CI installs with --no-root, so the package is imported from src/.
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra","--strict-markers","--strict-config"]
markers = [
  "unit: 纯单元测试",
  "integration: 需要 Postgres",
  "security: RLS 越权 fuzz, 需要 Postgres",
]
