[pytest]
testpaths =
    tests
    sdks/python/tests
addopts = --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath =
    sdks/python
    packages/api-platform/src
    packages/audit/src
    packages/authz/src
    packages/billing/src
    packages/compliance/src
    packages/crypto/src
    packages/data-protection/src
    packages/dlp/src
    packages/feature-flag/src
    packages/identity/src
    packages/lifecycle/src
    packages/llm-gateway/src
    packages/notification/src
    packages/org/src
    packages/pam/src
    packages/search/src
    packages/security-ops/src
markers =
    e2e: end-to-end tests that require a running foundation stack
    needs_stack: tests that require external services
