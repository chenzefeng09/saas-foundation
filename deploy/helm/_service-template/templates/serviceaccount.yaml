apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.fullname" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
  annotations:
    # Vault Agent auto-injection（如启用）
    vault.hashicorp.com/role: {{ .Values.global.vault.role | quote }}
automountServiceAccountToken: true
