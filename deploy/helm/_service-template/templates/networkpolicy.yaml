{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Always allow Prometheus scrape
    - from:
        - namespaceSelector:
            matchLabels:
              foundation.example.com/role: observability
      ports:
        - port: metrics
          protocol: TCP
    # Allow listed peer services
    {{- with .Values.networkPolicy.allowFrom }}
    - from:
        {{- range . }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
              app.kubernetes.io/part-of: saas-foundation
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    # Always allow ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              foundation.example.com/role: ingress
      ports:
        - port: http
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Foundation backends
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/part-of
                operator: In
                values: [saas-foundation]
    # Postgres / Redis / Vault / Keycloak / etc. — narrowed via headless services
    {{- with .Values.networkPolicy.egressExtra }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
