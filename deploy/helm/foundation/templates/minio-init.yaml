{{- /*
  minio-init — bucket bootstrap (storage-v1 §2.3)

  Creates the four storage-v1 buckets after Helm install/upgrade:
    foundation-audit          (Object Lock COMPLIANCE + N-year retention)
    foundation-workspace
    foundation-kb-raw
    foundation-kb-derived

  Runs as a Helm post-install / post-upgrade hook with `mc mb --ignore-existing`
  so re-runs are idempotent (adding a new bucket later is just an upgrade).

  Skipped on large profile (minio.enabled=false). Operators using an
  external S3 / OSS endpoint create the buckets manually in their cloud
  console; see values-large.yaml for the bucket-name override schema.

  Credentials are read from `.Values.global.storage.existingSecret`
  (keys: access-key / secret-key), the same Secret services-renderer.yaml
  injects into audit / security-ops.

  Endpoint is `.Values.global.storage.endpoint` (defaults to the in-cluster
  MinIO service, e.g. http://foundation-minio:9000).
*/ -}}
{{- if .Values.minio.enabled }}
{{- $defaultRetentionYears := .Values.global.storage.audit.retentionYears | default 7 -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: foundation-minio-init
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: saas-foundation
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: bucket-bootstrap
    foundation.example.com/profile: {{ .Values.global.profile | default "small" }}
  annotations:
    # Hook config: run on first install AND every upgrade, so adding a new
    # bucket later just requires editing the Job spec and `helm upgrade`.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # owner email (kube-linter required-annotation-email)
    email: {{ .Values.global.ownerEmail | default "foundation@example.com" | quote }}
spec:
  # Keep finished pods around briefly so operators can inspect logs after
  # the hook runs.  Helm's hook-delete-policy "hook-succeeded" still wins
  # on a clean run.
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: saas-foundation
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mc
          image: {{ .Values.global.storage.initImage | default "minio/mc:RELEASE.2025-09-07T16-15-50Z" | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MC_HOST_local
              # ``$()`` lets Kubernetes expand the two refs at runtime so we
              # never log the secret in plain text.  Format documented at
              # https://min.io/docs/minio/linux/reference/minio-mc.html#environment-variable-quick-reference
              value: "http://$(STORAGE_ACCESS_KEY):$(STORAGE_SECRET_KEY)@{{ regexReplaceAll "^https?://" .Values.global.storage.endpoint "" }}"
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.storage.existingSecret | quote }}
                  key: access-key
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.storage.existingSecret | quote }}
                  key: secret-key
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # storage-v1 §2.3 — bootstrap the four buckets.
              # mc reads the alias `local` from $MC_HOST_local; no `mc alias set`
              # required, which keeps creds off the process argv.
              echo "minio-init: creating storage-v1 buckets at {{ .Values.global.storage.endpoint }}"

              # AUDIT — Object Lock COMPLIANCE + {{ $defaultRetentionYears }}y retention.
              # --with-lock is no-op when the bucket already exists with lock enabled.
              mc mb --with-lock --ignore-existing "local/{{ .Values.global.storage.buckets.audit }}"
              mc retention set --default COMPLIANCE "{{ $defaultRetentionYears }}y" "local/{{ .Values.global.storage.buckets.audit }}"

              # WORKSPACE / KB_RAW / KB_DERIVED — plain buckets.
              mc mb --ignore-existing "local/{{ .Values.global.storage.buckets.workspace }}"
              mc mb --ignore-existing "local/{{ .Values.global.storage.buckets.kbRaw }}"
              mc mb --ignore-existing "local/{{ .Values.global.storage.buckets.kbDerived }}"

              echo "minio-init: buckets ready — {{ .Values.global.storage.buckets.audit }} / {{ .Values.global.storage.buckets.workspace }} / {{ .Values.global.storage.buckets.kbRaw }} / {{ .Values.global.storage.buckets.kbDerived }}"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            # mc writes its config to $HOME/.mc; readOnlyRootFilesystem forces
            # an emptyDir mount instead of the image's writable /root.
            - name: mc-config
              mountPath: /home/mc
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mc-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
