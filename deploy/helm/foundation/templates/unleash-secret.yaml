{{- /*
  foundation-unleash-credentials Secret
  生产：由 external-secrets / Vault Agent Injector 创建真实 Secret，
        本模板使用 lookup 检查是否已存在；已存在则跳过（不覆盖生产凭据）。
  small dev：首次 helm install 时生成占位 Secret，需事后替换真实 token。
*/}}
{{- $secretName := "foundation-unleash-credentials" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if not $existing }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: saas-foundation
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/note: |
      PLACEHOLDER — 在生产环境中请用 external-secrets 或 Vault Agent Injector
      注入真实的 admin-token / client-token，并删除本占位 Secret。
    # 不标 hook，让 helm upgrade 正常管理生命周期
type: Opaque
stringData:
  # Unleash Admin API token（具备所有管理权限；仅 feature-flag 服务和 init job 使用）
  # 格式：*:<env>.<random_string>  或  user:*.admin_secret_token
  admin-token: "REPLACE_ME_unleash_admin_token"
  # Unleash Client token（只读 client features；SDK 连接使用）
  # 格式：*:<env>.<random_string>
  client-token: "REPLACE_ME_unleash_client_token"
  # Unleash 服务 URL（内部 DNS；large 外置时改为外部地址）
  url: {{ .Values.global.unleash.url | quote }}
{{- end }}
