# =============================================================================
# large profile — 跨 AZ 私有化 / 1000+ 用户 / SaaS 主集群
#
# 特点：
#   - 跨 3 AZ 部署
#   - 业务 service 5+ 副本 + Karpenter 弹性
#   - 数据库主从跨 AZ
#   - mTLS + 国密 TLS（合规模式 equal_protection_4 时）
#   - 严格 PodSecurityContext / NetworkPolicy / topologySpread
# =============================================================================

global:
  profile: large
  ingress:
    enabled: true
    className: nginx
    tls: true
    externalAuthz:
      enabled: true
  mtls:
    enabled: true
  complianceModes:
    - pipl
    - equal_protection_3
    - soc2
  # 等保四级 / 密评场景下额外打开：
  # - finance_jrt0071
  # - equal_protection_4

# 数据库都假设客户已部署 / 共享集群，仅配置连接
postgresql:
  enabled: false
redis:
  enabled: false
keycloak:
  enabled: false
clickhouse:
  enabled: false
opensearch:
  # large: 关闭 chart 内嵌 OpenSearch, 用客户外部集群
  # 推荐外部集群规格 (跨 3 AZ):
  #   3 dedicated master nodes (t3.medium / 2vCPU 8GB)
  #   6 data nodes (r6g.2xlarge / 8vCPU 64GB, 每 AZ 2 节点)
  #   2 coordinating-only nodes (负载均衡查询)
  # 连接配置: 在 global.opensearch 中覆盖
  #   global.opensearch.host: "os-master.your-domain"
  #   global.opensearch.port: 9200
  #   global.opensearch.existingSecret: foundation-opensearch-credentials
  # TLS + basic auth: 通过 SEARCH_OPENSEARCH_USERNAME/PASSWORD secret 注入 (见 services-renderer)
  enabled: false
vault:
  enabled: false
minio:
  enabled: false
# large profile: 需用户提供外部 S3 / OSS / S3 兼容对象存储。
# minio-init Job 在 minio.enabled=false 时**不会渲染**——运维必须先在客户云控制台
# 手动创建 4 个 bucket 再 helm install / helm upgrade，否则服务首次写入会失败。
# 创建步骤（以 AWS S3 举例，OSS / 兼容存储步骤类似）：
#   1. aws s3api create-bucket --bucket acme-corp-foundation-audit-prod \
#        --object-lock-enabled-for-bucket --region cn-north-1
#   2. aws s3api put-object-lock-configuration --bucket acme-corp-foundation-audit-prod \
#        --object-lock-configuration '{"ObjectLockEnabled":"Enabled",
#          "Rule":{"DefaultRetention":{"Mode":"COMPLIANCE","Years":7}}}'
#   3. 其余 3 个 bucket 用 `aws s3api create-bucket` 即可（无需 lock）
# 在 values-prod-secrets.yaml 中覆盖 global.storage 即可：
# global:
#   storage:
#     endpoint: https://s3.cn-north-1.example.com
#     region: cn-north-1
#     existingSecret: foundation-s3-credentials  # 含 access-key / secret-key
#     buckets:
#       audit: acme-corp-foundation-audit-prod
#       workspace: acme-corp-foundation-workspace-prod
#       kbRaw: acme-corp-foundation-kb-raw-prod
#       kbDerived: acme-corp-foundation-kb-derived-prod
#     presignedUrlTtlSeconds: 3600
#     audit:
#       retentionYears: 7  # 与 put-object-lock-configuration 里的 Years 保持一致
# 旧 global.s3 节本期保留兼容，下版本计划下线。

# Unleash — large 关闭 subchart；使用外置 Unleash 高可用集群
# 外置集群建议：3 Unleash 实例 + 外部 Postgres（可复用 global DB）
# 在生产 values-prod-secrets.yaml 中覆盖：
#   global.unleash.url: "https://unleash.internal.your-domain"
#   featureFlagUnleash.existingSecret: foundation-unleash-credentials (由 external-secrets 注入)
unleash:
  enabled: false   # large 不内嵌，用外置

_serviceDefaults: &serviceDefaults
  replicaCount: 5
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 50
    targetCPUUtilizationPercentage: 60
    # 自定义指标（KEDA）
    customMetrics:
      - type: Pods
        pods:
          metric:
            name: foundation_service_inflight_requests
          target:
            type: AverageValue
            averageValue: "50"
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2,    memory: 2Gi }
  podDisruptionBudget:
    enabled: true
    minAvailable: 3
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  networkPolicy:
    enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true

services:
  identity:        { <<: *serviceDefaults }
  authz:           { <<: *serviceDefaults, replicaCount: 8 }  # 高 QPS
  org:             { <<: *serviceDefaults }
  billing:         { <<: *serviceDefaults }
  audit:           { <<: *serviceDefaults, replicaCount: 10 } # 写入压力
  lifecycle:       { <<: *serviceDefaults }
  notification:    { <<: *serviceDefaults }
  search:          { <<: *serviceDefaults, replicaCount: 6 }  # search 读多, 多副本分散 OS 查询
  apiPlatform:     { <<: *serviceDefaults }
  llmGateway:      { <<: *serviceDefaults, replicaCount: 10 } # 长连接 SSE
  featureFlag:     { <<: *serviceDefaults }
  classification:  { <<: *serviceDefaults }
  dlp:             { <<: *serviceDefaults }
  crypto:          { <<: *serviceDefaults }
  compliance:      { <<: *serviceDefaults }
  pam:             { <<: *serviceDefaults }
  dataProtection:  { <<: *serviceDefaults }
  securityOps:     { <<: *serviceDefaults }
