# =============================================================================
# medium profile — 企业私有化 / 3-10 节点 / 100-500 用户 / HA
#
# 特点：
#   - 业务 service 多副本（3+）
#   - Postgres Patroni 1 主 2 从
#   - Redis Sentinel 3 节点
#   - ClickHouse Replicated 3 节点
#   - OpenSearch 3 master + 3 data
#   - Vault Raft 3 节点（生产模式）
#   - mTLS 开启
#   - HPA 开启
# =============================================================================

global:
  profile: medium
  ingress:
    enabled: true
    className: nginx
    tls: true
    externalAuthz:
      enabled: true
  mtls:
    enabled: true
  complianceModes:
    - pipl
    - equal_protection_3

postgresql:
  enabled: false   # medium 通常用 CloudNativePG / Crunchy Operator
  # 改用客户外置 DB 时：
  # global.database.host: pg-primary.your-domain
  # global.database.port: 5432

redis:
  enabled: true
  architecture: replication
  sentinel:
    enabled: true
    quorum: 2
  replica:
    replicaCount: 2

keycloak:
  enabled: true
  replicaCount: 2
  production: true
  # production=true 时子 chart 强制要求 TLS；本栈在 ingress(nginx) 层终止 TLS、
  # keycloak 自身走 HTTP，故用标准的 edge 代理模式满足校验（无需给 pod 塞 keystore）。
  proxy: edge
  # cache 必须是 map（子 chart 默认 {enabled,stackName,stackFile}）；
  # 写成标量 "ispn" 会覆盖 table 导致 .Values.cache.enabled 取值失败、渲染报错。
  # enabled=true 即启用 ispn 集群缓存栈（多副本必需），stackName=kubernetes 走 DNS 发现。
  cache:
    enabled: true
    stackName: kubernetes

clickhouse:
  enabled: true
  shards: 1
  replicaCount: 3
  zookeeper:
    enabled: true
    replicaCount: 3
  persistence:
    size: 200Gi

opensearch:
  enabled: true
  # medium: 3 dedicated master + 3 data nodes (单 AZ HA)
  # 使用 opensearch-project/helm-charts/opensearch chart
  # master 角色: 选主, 不存数据
  # data 角色: 存储 + 搜索
  masterCount: 3          # 3 master-eligible nodes → quorum=2
  replicas: 3             # data nodes (若 chart 将 replicas 映射到 data 节点)
  # 若所用 chart 用 nodeGroups 区分角色:
  # nodeGroups:
  #   - name: masters
  #     roles: [master]
  #     replicas: 3
  #     resources:
  #       requests: { cpu: 500m, memory: 2Gi }
  #       limits:   { cpu: 1,    memory: 4Gi }
  #   - name: data
  #     roles: [data, ingest]
  #     replicas: 3
  #     resources:
  #       requests: { cpu: 1,    memory: 4Gi }
  #       limits:   { cpu: 2,    memory: 8Gi }
  #     persistence:
  #       enabled: true
  #       size: 100Gi
  security:
    enabled: true         # 生产开启 TLS + basic auth
  persistence:
    enabled: true
    size: 100Gi
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits:   { cpu: 2,    memory: 4Gi }
  # 反亲和: 确保 master/data 分散到不同节点
  antiAffinity: soft      # medium 用 soft (节点数可能不够 hard)

vault:
  enabled: true
  server:
    ha:
      enabled: true
      replicas: 3
      raft:
        enabled: true

minio:
  enabled: true
  mode: distributed
  replicas: 4
  persistence:
    size: 200Gi

# Unleash — medium 内嵌，单副本（HA 靠 DB 事务；Unleash 无状态）
unleash:
  enabled: true
  replicaCount: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 1Gi }
  config:
    logLevel: warn
    databaseSsl: "true"   # medium+ 强制 TLS 连 PG

# Service 副本 + 资源底线
_serviceDefaults: &serviceDefaults
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 1Gi }
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway

services:
  identity:        { <<: *serviceDefaults }
  authz:           { <<: *serviceDefaults }
  org:             { <<: *serviceDefaults }
  billing:         { <<: *serviceDefaults }
  audit:           { <<: *serviceDefaults }
  lifecycle:       { <<: *serviceDefaults }
  notification:    { <<: *serviceDefaults }
  search:          { <<: *serviceDefaults }
  apiPlatform:     { <<: *serviceDefaults }
  llmGateway:      { <<: *serviceDefaults }
  featureFlag:     { <<: *serviceDefaults }
  classification:  { <<: *serviceDefaults }
  dlp:             { <<: *serviceDefaults }
  crypto:          { <<: *serviceDefaults }
  compliance:      { <<: *serviceDefaults }
  pam:             { <<: *serviceDefaults }
  dataProtection:  { <<: *serviceDefaults }
  securityOps:     { <<: *serviceDefaults }
