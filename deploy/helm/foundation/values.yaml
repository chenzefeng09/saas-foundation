# =============================================================================
# Foundation umbrella chart — 默认值（small profile 基线）
#
# 三档 profile 通过专用 values 文件覆盖：
#   helm install foundation . -f values-small.yaml
#   helm install foundation . -f values-medium.yaml -f values-prod-secrets.yaml
#   helm install foundation . -f values-large.yaml
#
# 任何 service 的 values 必须支持 profile 占位（详见 _service-template/values.yaml）
# =============================================================================

global:
  # 部署形态：small | medium | large
  profile: small

  # 资源 owner 邮箱（写入各 Deployment 的 email annotation，满足 kube-linter
  # required-annotation-email；生产可覆盖为真实 owner/团队邮箱）
  ownerEmail: foundation@example.com

  # 镜像拉取
  imageRegistry: registry.example.com/saas-foundation
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

  # global.imageRegistry 把 bitnami 子 chart（postgresql/redis/clickhouse→zookeeper 等）
  # 的镜像重写到私有 registry，触发 bitnami 新版的非标准镜像校验，渲染会直接报错。
  # 私有 registry 即官方镜像的内部镜像源，显式放行。
  # 见 https://github.com/bitnami/charts/issues/30850
  security:
    allowInsecureImages: true

  # 域名 / Ingress
  ingress:
    enabled: true
    className: nginx
    host: foundation.local
    tls: false
    annotations: {}

  # mTLS（生产强烈建议开）
  mtls:
    enabled: false

  # 合规模式（影响默认密码策略、保留期、加密算法等）
  complianceModes:
    - pipl

  # 数据驻留
  dataResidency: cn-only

  # 时区
  timezone: Asia/Shanghai

  # 全局 nodeSelector / tolerations / affinity（service 可覆盖）
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # 第三方组件配置（service 通过 .Values.global.* 读）
  database:
    host: foundation-pgbouncer
    port: 6432
    name: foundation
    sslMode: prefer
    # 凭据从 Vault / External Secrets 注入；本地开发用 secret
    existingSecret: foundation-db-credentials
  redis:
    host: foundation-redis-master
    port: 6379
    existingSecret: foundation-redis-credentials
  keycloak:
    url: http://foundation-keycloak/auth
    realm: foundation
  clickhouse:
    host: foundation-clickhouse
    port: 9000
    database: audit
    existingSecret: foundation-clickhouse-credentials
  opensearch:
    host: foundation-opensearch
    port: 9200
    existingSecret: foundation-opensearch-credentials
  vault:
    addr: http://foundation-vault:8200
    role: foundation-services
  s3:
    endpoint: http://foundation-minio:9000
    region: cn-default
    bucket: foundation
    existingSecret: foundation-s3-credentials
  otelCollector:
    endpoint: http://foundation-otel-collector:4317
  opa:
    url: http://foundation-opa:8181
  unleash:
    # 服务内地址；large profile 关闭 subchart 时改为外置 Unleash URL
    url: http://foundation-unleash:4242

# =============================================================================
# 第三方依赖开关（按 profile 启停）
# =============================================================================
# small profile 默认全开（自包含）
# medium/large 通常关闭，用客户已有/共享集群
postgresql:
  enabled: true
  auth:
    postgresPassword: ""  # set in secrets
    database: foundation
  primary:
    persistence:
      size: 20Gi

redis:
  enabled: true
  auth:
    enabled: true
  master:
    persistence:
      size: 8Gi

keycloak:
  enabled: true
  auth:
    adminUser: admin
    existingSecret: foundation-keycloak-admin-credentials

clickhouse:
  enabled: true
  shards: 1
  replicaCount: 1
  persistence:
    size: 50Gi

opensearch:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi

vault:
  enabled: true
  server:
    dev:
      enabled: true  # ⚠️ small only；medium+ 关闭并用 raft

minio:
  enabled: true
  mode: standalone
  persistence:
    size: 50Gi

otel-collector:
  enabled: true
  mode: deployment
  # opentelemetry-collector chart 0.100.x 起 image.repository 无默认值，必须显式设置
  # （见 chart UPGRADING.md），否则 NOTES.txt 渲染直接报错。
  # 与 docker-compose dev 栈保持一致：使用 contrib 镜像，command.name 须为 otelcol-contrib。
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.108.0"
  command:
    name: otelcol-contrib

opa:
  enabled: true

# Unleash — Feature Flag 后端
unleash:
  enabled: true
  replicaCount: 1
  image:
    repository: unleashorg/unleash-server
    tag: "6.4"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # 生产通过 external-secrets / Vault Agent Injector 挂载真实凭据；
  # small/medium 明文 placeholder，上线前必须替换。
  # 数据库连接：指向 foundation 同实例的 unleash 逻辑库（medium+ 建议独立实例）
  postgresql:
    enabled: false   # 复用 global postgresql，不内嵌 sub-Postgres
  # 连接信息通过 secret 注入（见 templates/unleash-secret.yaml）
  existingSecret: foundation-unleash-credentials
  # admin token / client token 从 secret key 读
  adminTokenSecretKey: admin-token
  clientTokenSecretKey: client-token
  # 非 secret 配置
  config:
    logLevel: warn
    databaseSsl: "false"

# feature-flag 服务连接 Unleash 的 secret 引用（凭据不明文出现在 values）
featureFlagUnleash:
  existingSecret: foundation-unleash-credentials
  urlSecretKey: url              # optional；未设置则用 global unleash service DNS
  clientTokenSecretKey: client-token
  adminTokenSecretKey: admin-token

# =============================================================================
# Service 列表 — 每个 service 一段
# 共 18 个 service；启动时间长，可按需 enabled: false 分批上
# =============================================================================
services:
  identity:
    enabled: true
    image:
      repository: foundation/identity
      tag: ""  # default to .Chart.AppVersion
    replicaCount: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    autoscaling:
      enabled: false  # small profile

  authz:
    enabled: true
    image:
      repository: foundation/authz
    replicaCount: 1

  org:
    enabled: true
  billing:
    enabled: true
  audit:
    enabled: true
  lifecycle:
    enabled: true
  notification:
    enabled: true
  search:
    enabled: true
  apiPlatform:
    enabled: true
  llmGateway:
    enabled: true
  featureFlag:
    enabled: true
  classification:
    enabled: true
  dlp:
    enabled: true
  crypto:
    enabled: true
  compliance:
    enabled: true
  pam:
    enabled: true
  dataProtection:
    enabled: true
  securityOps:
    enabled: true

# =============================================================================
# 管理控制台前端
# =============================================================================
adminConsole:
  enabled: true
  image:
    repository: foundation/admin-console
  replicaCount: 1
  ingress:
    path: /admin
