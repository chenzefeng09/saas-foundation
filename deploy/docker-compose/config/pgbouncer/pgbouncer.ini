; =============================================================================
; PgBouncer 配置 — saas-foundation 本地开发
; 详见 docs/multi-tenancy.md §4
; 关键约束：pool_mode 必须是 transaction 或 session，不能是 statement
; =============================================================================

[databases]
foundation = host=postgres port=5432 dbname=foundation
keycloak   = host=postgres port=5432 dbname=keycloak
unleash    = host=postgres port=5432 dbname=unleash

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- 认证 ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer_admin
stats_users = app_observability

; --- 池模式（RLS 安全关键）---
pool_mode = transaction
server_reset_query =
server_reset_query_always = 0

; --- 连接池大小 ---
max_client_conn = 500
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100

; --- 超时 ---
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
query_wait_timeout = 30
client_idle_timeout = 0

; --- 兼容性 ---
ignore_startup_parameters = extra_float_digits,application_name,search_path

; --- 日志 ---
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; --- TLS（生产必开；本地开发关闭） ---
;server_tls_sslmode = require
;client_tls_sslmode = require
