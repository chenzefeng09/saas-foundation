# =============================================================================
# Prometheus — saas-foundation 本地开发
# 仅抓 otel-collector 暴露的 :8889；其他服务通过 OTLP 推给 collector，
# collector 用 prometheus exporter 转换 metric 后落地此处。
# 生产环境改 service discovery + Thanos remote-write。
# =============================================================================
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    deployment: foundation-dev

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
