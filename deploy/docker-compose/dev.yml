  # ===========================================================================
  # search-init — 建 OpenSearch 索引 + alias（一次性 job）
  # 幂等：PUT returns 400 if index already exists — filtered by || true
  # ===========================================================================
  search-init:
    image: curlimages/curl:8.8.0
    container_name: foundation-search-init
    restart: "no"
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./config/opensearch/index-mapping.json:/tmp/index-mapping.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        OS_URL=http://opensearch:9200
        INDEX=foundation-search-v1
        ALIAS=foundation-search

        echo "=== search-init: creating index $${INDEX} ==="
        HTTP_CODE=$$(curl -s -o /tmp/os_resp.txt -w "%{http_code}" \
          -X PUT "$${OS_URL}/$${INDEX}" \
          -H "Content-Type: application/json" \
          -d @/tmp/index-mapping.json)

        if [ "$${HTTP_CODE}" = "200" ]; then
          echo "=== search-init: index $${INDEX} created ==="
        elif [ "$${HTTP_CODE}" = "400" ]; then
          echo "=== search-init: index $${INDEX} already exists (idempotent) ==="
        else
          echo "=== search-init: unexpected HTTP $${HTTP_CODE} ===" >&2
          cat /tmp/os_resp.txt >&2
          exit 1
        fi

        echo "=== search-init: creating alias $${ALIAS} → $${INDEX} ==="
        curl -sf -X POST "$${OS_URL}/_aliases" \
          -H "Content-Type: application/json" \
          -d "{\"actions\":[{\"add\":{\"index\":\"$${INDEX}\",\"alias\":\"$${ALIAS}\"}}]}" \
          || true

        echo "=== search-init: done ==="
    networks: [foundation]

