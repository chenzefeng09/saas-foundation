          (id, tenant_id, email, display_name, status, keycloak_user_id, roles,
           mfa_enabled, failed_login_count)
        VALUES
          -- admin@foundation.local → Tenant A → super_admin
          -- id 必须与 authz-init 里 --admin-user-id 完全一致
          ('usr_01KT7TZ70AM2RK8P0C01KMBPRR',
           'tnt_01J5DEVXX00000000000000001',
           'admin@foundation.local',
           'Admin',
           'ACTIVE',
           '9c5b9300-73b6-49b2-911e-ece4675e9c29',
           '{"super_admin"}',
           false, 0),
          -- alice@tenant-a.local → Tenant A → member
          ('usr_01J5DEVUSRALICE00000000000',
           'tnt_01J5DEVXX00000000000000001',
           'alice@tenant-a.local',
           'Alice',
           'ACTIVE',
           'f354d276-886d-4d3b-828f-003ff1112919',
           '{"member"}',
           false, 0),
          -- bob@tenant-a.local → Tenant A → member
          ('usr_01J5DEVUSR0BOB000000000000',
           'tnt_01J5DEVXX00000000000000001',
           'bob@tenant-a.local',
           'Bob',
           'ACTIVE',
           'fa1ec69a-8e64-472b-aafd-aea23118d62e',
           '{"member"}',
           false, 0),
          -- carol@tenant-b.local → Tenant B → member
          ('usr_01J5DEVUSRCAROL00000000000',
           'tnt_01J5DEVXX00000000000000002',
           'carol@tenant-b.local',
           'Carol',
           'ACTIVE',
           '3b873c91-eb45-4d6b-b63c-8b1a81f5b3ab',
           '{"member"}',
           false, 0)
        ON CONFLICT (id) DO NOTHING;
        SQL
        echo "=== identity-init: all done ==="
