# =============================================================================
# saas-foundation 本地开发栈（all-in-one docker-compose）
#
# 一行启动：  cd deploy/docker-compose && cp .env.example .env && docker compose -f dev.yml up -d
# 健康检查： docker compose -f dev.yml ps
# 完整清理： docker compose -f dev.yml down -v
#
# 端口/账号默认值见 .env.example
# 数据卷在 docker volume 里；强制清空请显式加 -v
# =============================================================================

name: saas-foundation-dev

networks:
  foundation:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  clickhouse_data:
  opensearch_data:
  minio_data:
  keycloak_data:
  vault_data:

services:
  # ===========================================================================
  # Postgres — 唯一数据库；多个逻辑库（foundation/keycloak/unleash）共用一个实例
  # 生产 medium+ 改 Patroni 集群
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:${POSTGRES_VERSION:-pg16}
    container_name: foundation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundation}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres_super_change_me}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-app_user_change_me}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-app_admin_change_me}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}
      APP_OBSERVABILITY_PASSWORD: ${APP_OBSERVABILITY_PASSWORD:-app_obs_change_me}
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_min_duration_statement=200"

  # ===========================================================================
  # PgBouncer — 强约束 transaction 模式（详见 docs/multi-tenancy.md §4）
  # ===========================================================================
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: foundation-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT_PGBOUNCER:-6432}:6432"
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks: [foundation]
    healthcheck:
      test: ["CMD", "sh", "-c", "psql 'host=127.0.0.1 port=6432 user=pgbouncer_admin password=pgbouncer_admin_change_me dbname=pgbouncer' -c 'SHOW POOLS' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # Redis — Sentinel 模式简化为单实例；medium+ 上 Sentinel
  # ===========================================================================
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: foundation-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_change_me}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${PORT_REDIS:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [foundation]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # Keycloak — Identity Provider；本地用 dev 模式跳过 hostname 严格校验
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-25.0}
    container_name: foundation-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: app_migrator
      KC_DB_PASSWORD: ${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_change_me}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Dev: allow plain HTTP and disable HTTPS-only enforcement.
      # KC 25 removed KC_PROXY=edge; switched to proxy-headers.
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: INFO
    ports:
      - "${PORT_KEYCLOAK:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./init/keycloak:/opt/keycloak/data/import:ro
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ===========================================================================
  # ClickHouse — 审计与可观测性后端
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}
    container_name: foundation-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-foundation}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_change_me}
      CLICKHOUSE_DB: audit
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${PORT_CLICKHOUSE_HTTP:-8123}:8123"
      - "${PORT_CLICKHOUSE_TCP:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse/audit-schema.sql:/docker-entrypoint-initdb.d/01-audit-schema.sql:ro
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "wget -nv -O - 'http://127.0.0.1:8123/ping' | grep -q Ok"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # OpenSearch — 搜索；单节点开发模式（生产 3 节点）
  # dev 关闭 security plugin：HTTP 无 auth，ACL 隔离靠应用层 tenant_id filter
  # ===========================================================================
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.16.0}
    container_name: foundation-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Security plugin disabled in dev — simplifies client config and healthcheck;
      # production uses TLS + basic auth (plugins.security.disabled: "false").
      plugins.security.disabled: "true"
      # Required by OpenSearch 2.12+ even when security plugin is disabled.
      # This is a dummy value used only during first-time setup; auth is disabled at runtime.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-Admin@1234567890}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${PORT_OPENSEARCH_HTTP:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health | grep -E '\"status\":\"(yellow|green)\"'"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # Vault — KMS / Secret 管理；本地开发模式（生产 raft + 3 节点）
  # ===========================================================================
  vault:
    image: hashicorp/vault:${VAULT_VERSION:-1.17}
    container_name: foundation-vault
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    ports:
      - "${PORT_VAULT:-8200}:8200"
    volumes:
      - vault_data:/vault/file
    networks: [foundation]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # MinIO — S3 兼容对象存储；带 Object Lock 支持（WORM）
  # 必须在 server 命令中加 --console-address 且不传 --no-lock 才能开启 Object Lock
  # ===========================================================================
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    container_name: foundation-minio
    restart: unless-stopped
    # --console-address enables the UI; Object Lock requires no extra server flag in RELEASE.2024+
    command: ["server", "/data", "--console-address", ":9002"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foundation}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
    ports:
      - "${PORT_MINIO_API:-9001}:9000"
      - "${PORT_MINIO_CONSOLE:-9002}:9002"
    volumes:
      - minio_data:/data
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || curl -sf http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # minio-init — 建 storage-v1 buckets（一次性 job, 幂等）
  # storage-v1 §2.3 新增 4 个抽象层 bucket：
  #   foundation-audit       (WORM, COMPLIANCE 7y)  —— 替代旧 foundation-audit-worm
  #   foundation-workspace   (普通)
  #   foundation-kb-raw      (普通)
  #   foundation-kb-derived  (普通)
  # 兼容期保留：foundation-audit-worm（audit 服务双写期需要老 bucket 存在；
  # Phase 2 切换到抽象层后，由迁移脚本统一搬迁，再下线本 bucket）。
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: foundation-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-foundation} ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}

        # --- storage-v1 新 bucket（Phase 1 引入） ---
        # AUDIT: Object Lock + 7 年 COMPLIANCE
        mc mb --with-lock --ignore-existing local/foundation-audit
        mc retention set --default COMPLIANCE "7y" local/foundation-audit
        # WORKSPACE / KB_RAW / KB_DERIVED: 普通 bucket
        mc mb --ignore-existing local/foundation-workspace
        mc mb --ignore-existing local/foundation-kb-raw
        mc mb --ignore-existing local/foundation-kb-derived

        # --- 兼容期保留（doublewrite 期需要） ---
        # foundation-audit-worm: 旧 audit 服务直写 bucket；Phase 2 抽象层接通后，
        # 由迁移脚本搬运历史对象到 foundation-audit，再下线本 bucket。
        mc mb --with-lock --ignore-existing local/foundation-audit-worm
        mc retention set --default COMPLIANCE "7y" local/foundation-audit-worm

        echo "=== minio-init: storage-v1 buckets ready (audit/workspace/kb-raw/kb-derived + legacy worm) ==="
    networks: [foundation]

  # ===========================================================================
  # OPA — 授权策略引擎
  # ===========================================================================
  opa:
    image: openpolicyagent/opa:1.16.2-static
    container_name: foundation-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--log-level=info"
      - "--set=decision_logs.console=true"
      - "--ignore=*_test.rego"
      - "/policies"
      - "/data"
    volumes:
      - ./config/opa/policies:/policies:ro
      - ./config/opa/data:/data:ro
    ports:
      - "8181:8181"
    networks: [foundation]
    # opa:1.x-static is distroless (no wget/shell/curl).  The healthcheck
    # cannot run inside the container.  OPA starts in <1 s and is stable,
    # so we rely on service_started for dependents rather than service_healthy.
    # (If a native health probe is needed in future, switch to a non-static tag.)

  # ===========================================================================
  # migration-runner — 按序跑所有 foundation 服务的 Alembic 迁移（一次性 job）
  #
  # 顺序：identity → authz → org → billing（billing 依赖 tenant.tenant FK）
  # 每个服务从自己的 builder stage 跑，builder 有 shell + 完整 Python 包
  # billing 的 Dockerfile 未打包 migrations/alembic.ini，用 volume 挂载补全
  # ===========================================================================
  migration-runner:
    image: python:3.12-slim-bookworm
    container_name: foundation-migration-runner
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      IDENTITY_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      AUTHZ_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      ORG_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      BILLING_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      CRYPTO_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      CRYPTO_VAULT_URL: http://vault:8200
      CRYPTO_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
      AUDIT_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      FEATURE_FLAG_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      SEARCH_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      LLM_GATEWAY_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      NOTIFICATION_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      API_PLATFORM_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      PAM_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      DLP_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      COMPLIANCE_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      SECURITY_OPS_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      LIFECYCLE_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      DATA_PROTECTION_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # 走清华源，避开默认 PyPI 在国内的 hash 不匹配问题
        export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        export PIP_TRUSTED_HOST=pypi.tuna.tsinghua.edu.cn
        pip install --quiet -i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn poetry
        # Put venvs in /tmp so we don't write into the read-only source mounts
        export POETRY_VIRTUALENVS_PATH=/tmp/poetry-venvs
        export POETRY_VIRTUALENVS_IN_PROJECT=false
        run_migration() {
          svc="$$1"; pkg_dir="$$2"
          echo "=== Running $${svc} migrations ==="
          # Copy to /tmp so poetry can write lock updates (source mounts are :ro).
          # Remove any stale copy first: on container *restart* (not recreate)
          # /tmp/$${svc} already exists, and `cp -r src existing_dir` would nest
          # the source under /tmp/$${svc}/$${svc}, leaving poetry/alembic to run
          # against the previous run's stale copy.
          rm -rf /tmp/$${svc}
          cp -r "$${pkg_dir}" /tmp/$${svc}
          cd /tmp/$${svc}
          # Don't swallow install errors: with `set -e` + --quiet a failed install
          # exits 1 with no output, leaving logs stuck at "=== Running ... ===".
          poetry install --only main --quiet || { echo "poetry install failed for $${svc}"; poetry install --only main; exit 1; }
          poetry run alembic upgrade head
          echo "=== $${svc} migrations done ==="
        }
        run_migration identity    /mnt/identity
        run_migration authz       /mnt/authz
        run_migration org         /mnt/org
        run_migration billing     /mnt/billing
        run_migration crypto      /mnt/crypto
        run_migration audit       /mnt/audit
        run_migration feature-flag /mnt/feature-flag
        run_migration search       /mnt/search
        run_migration llm-gateway  /mnt/llm-gateway
        run_migration notification  /mnt/notification
        run_migration api-platform  /mnt/api-platform
        run_migration pam           /mnt/pam
        run_migration dlp           /mnt/dlp
        run_migration compliance    /mnt/compliance
        run_migration security-ops    /mnt/security-ops
        run_migration lifecycle       /mnt/lifecycle
        run_migration data-protection /mnt/data-protection
        echo "=== All migrations complete ==="
    networks: [foundation]
    volumes:
      - ../../packages/identity:/mnt/identity:ro
      - ../../packages/authz:/mnt/authz:ro
      - ../../packages/org:/mnt/org:ro
      - ../../packages/billing:/mnt/billing:ro
      - ../../packages/crypto:/mnt/crypto:ro
      - ../../packages/audit:/mnt/audit:ro
      - ../../packages/feature-flag:/mnt/feature-flag:ro
      - ../../packages/search:/mnt/search:ro
      - ../../packages/llm-gateway:/mnt/llm-gateway:ro
      - ../../packages/notification:/mnt/notification:ro
      - ../../packages/api-platform:/mnt/api-platform:ro
      - ../../packages/pam:/mnt/pam:ro
      - ../../packages/dlp:/mnt/dlp:ro
      - ../../packages/compliance:/mnt/compliance:ro
      - ../../packages/security-ops:/mnt/security-ops:ro
      - ../../packages/lifecycle:/mnt/lifecycle:ro
      - ../../packages/data-protection:/mnt/data-protection:ro

  # ===========================================================================
  # foundation-identity — 身份服务   (port 8001)
  # ===========================================================================
  identity:
    build:
      context: ../../packages/identity
      dockerfile: Dockerfile
    container_name: foundation-identity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      IDENTITY_ENV: dev
      IDENTITY_LOG_LEVEL: INFO
      IDENTITY_LOG_FORMAT: console
      IDENTITY_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      IDENTITY_DB_DSN_ADMIN: postgresql+asyncpg://app_admin:${APP_ADMIN_PASSWORD:-app_admin_change_me}@pgbouncer:6432/foundation
      IDENTITY_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      IDENTITY_KEYCLOAK_BASE_URL: http://keycloak:8080
      IDENTITY_KEYCLOAK_REALM: foundation
      IDENTITY_KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      IDENTITY_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_change_me}
      # Tokens issued via the internal Docker hostname carry iss=keycloak:8080
      IDENTITY_JWT_ISSUER: http://keycloak:8080/realms/foundation
      # Browser-facing Keycloak base for the SSO authorize-url (end user's browser
      # cannot resolve the in-cluster `keycloak` hostname; it must hit the host port).
      IDENTITY_KEYCLOAK_PUBLIC_BASE_URL: http://127.0.0.1:8080
      IDENTITY_VAULT_URL: http://vault:8200
      IDENTITY_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
      IDENTITY_OTEL_ENABLED: "true"
      IDENTITY_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      IDENTITY_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_me}@redis:6379/0
    ports:
      - "${PORT_IDENTITY:-8001}:8001"
    networks:
      foundation:
        aliases:
          - identity-service
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/api/identity/v1/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # foundation-authz — 授权服务   (port 8002)
  # ===========================================================================
  authz:
    build:
      context: ../../packages/authz
      dockerfile: Dockerfile
    container_name: foundation-authz
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started   # static image has no healthcheck tool; OPA starts in <1s
      migration-runner:
        condition: service_completed_successfully
    environment:
      AUTHZ_ENV: dev
      AUTHZ_LOG_LEVEL: INFO
      AUTHZ_LOG_FORMAT: console
      AUTHZ_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      AUTHZ_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      AUTHZ_OPA_URL: http://opa:8181/v1
      AUTHZ_OTEL_ENABLED: "true"
      AUTHZ_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_AUTHZ:-8002}:8002"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8002/api/authz/v1/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # foundation-org — 组织服务   (port 8003)
  # ===========================================================================
  org:
    build:
      context: ../../packages/org
      dockerfile: Dockerfile
    container_name: foundation-org
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      ORG_ENV: dev
      ORG_LOG_LEVEL: INFO
      ORG_LOG_FORMAT: console
      ORG_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      ORG_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      ORG_OTEL_ENABLED: "true"
      ORG_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_ORG:-8003}:8003"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8003/api/org/v1/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # foundation-billing — 计费服务   (port 8007)
  # ===========================================================================
  billing:
    build:
      context: ../../packages/billing
      dockerfile: Dockerfile
    container_name: foundation-billing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
      billing-init:
        condition: service_completed_successfully
    environment:
      BILLING_ENV: dev
      BILLING_LOG_LEVEL: INFO
      BILLING_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      BILLING_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      BILLING_OTEL_ENABLED: "true"
      BILLING_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      # host 端口用 8017 避开 agent-platform 的 agent-scheduler(host 8007)；
      # 容器内仍 8007，服务间用 billing:8007 互访不受影响
      - "${PORT_BILLING:-8017}:8007"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8007/api/billing/v1/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # Unleash — Feature Flag（默认栈，feature-flag 服务依赖它）
  # ===========================================================================
  unleash:
    image: unleashorg/unleash-server:${UNLEASH_VERSION:-6.4}
    container_name: foundation-unleash
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      INIT_ADMIN_API_TOKENS: "*:*.unleash-insecure-admin-api-token"
      INIT_FRONTEND_API_TOKENS: "*:development.unleash-insecure-frontend-api-token"
      # Client token (SDK /api/client/features). The feature-flag service's Unleash
      # SDK needs a CLIENT-type token; a frontend token returns 403 on that endpoint.
      INIT_CLIENT_API_TOKENS: "*:development.unleash-insecure-client-api-token"
    ports:
      - "${PORT_UNLEASH:-4242}:4242"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4242/health | grep -q GOOD"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # unleash-init — 幂等同步 flag preset + strategy 到 Unleash（一次性 job）
  #
  # 处理 Unleash v6 坑：环境启用后会自动插入 flexibleRollout 100% default strategy，
  # 本脚本在写入业务 strategy 前先删除已有 strategies，防止 100% 兜底覆盖业务约束。
  # 幂等：flag 已存在时跳过创建，strategy 每次先 delete + 重写，保证状态确定。
  # ===========================================================================
  unleash-init:
    image: curlimages/curl:8.8.0
    container_name: foundation-unleash-init
    restart: "no"
    depends_on:
      unleash:
        condition: service_healthy
    environment:
      UNLEASH_URL: http://unleash:4242
      UNLEASH_ADMIN_TOKEN: ${UNLEASH_ADMIN_TOKEN:-*:*.unleash-insecure-admin-api-token}
      UNLEASH_PROJECT: default
      UNLEASH_ENV: development
    volumes:
      - ./config/unleash/init-flags.sh:/init-flags.sh:ro
    entrypoint: ["/bin/sh", "/init-flags.sh"]
    networks: [foundation]

  # ===========================================================================
  # foundation-feature-flag — Feature Flag 服务   (port 8012)
  # ===========================================================================
  feature-flag:
    build:
      context: ../../packages/feature-flag
      dockerfile: Dockerfile
    container_name: foundation-feature-flag
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      unleash:
        condition: service_healthy
      unleash-init:
        condition: service_completed_successfully
      migration-runner:
        condition: service_completed_successfully
    environment:
      FEATURE_FLAG_ENV: dev
      FEATURE_FLAG_LOG_LEVEL: INFO
      FEATURE_FLAG_LOG_FORMAT: console
      FEATURE_FLAG_HTTP_PORT: "8012"
      FEATURE_FLAG_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      FEATURE_FLAG_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      FEATURE_FLAG_UNLEASH_ENABLED: "true"
      FEATURE_FLAG_UNLEASH_URL: http://unleash:4242
      # client token（只需 client features 权限；必须是 CLIENT 类型，frontend token 会 403）
      FEATURE_FLAG_UNLEASH_API_TOKEN: ${UNLEASH_CLIENT_TOKEN:-*:development.unleash-insecure-client-api-token}
      # admin token（flags 管理 / kill-switch 写回）
      FEATURE_FLAG_UNLEASH_ADMIN_TOKEN: ${UNLEASH_ADMIN_TOKEN:-*:*.unleash-insecure-admin-api-token}
      FEATURE_FLAG_UNLEASH_APP_NAME: feature-flag-service
      FEATURE_FLAG_OTEL_ENABLED: "true"
      FEATURE_FLAG_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_FEATURE_FLAG:-8012}:8012"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8012/api/feature-flag/v1/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # OTel Collector — 收口所有 trace/log/metric，转发到 Jaeger（本地）
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.108.0}
    container_name: foundation-otel
    restart: unless-stopped
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./config/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "${PORT_OTEL_GRPC:-4317}:4317"
      - "${PORT_OTEL_HTTP:-4318}:4318"
    networks: [foundation]
    depends_on:
      - jaeger

  # ===========================================================================
  # Jaeger — 本地 trace 可视化（生产用 ClickHouse + Grafana Tempo）
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: foundation-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${PORT_JAEGER_UI:-16686}:16686"
    networks: [foundation]

  # ===========================================================================
  # vault-init — 启用 Vault transit secrets engine（一次性 job）
  # crypto 服务依赖 transit engine 已开启才能创建/使用 KEK
  # ===========================================================================
  vault-init:
    image: hashicorp/vault:${VAULT_VERSION:-1.17}
    container_name: foundation-vault-init
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Initialising Vault transit engine ==="
        vault secrets enable transit || true
        echo "=== Vault transit ready ==="
    networks: [foundation]

  # ===========================================================================
  # vault-transit-reconcile — Vault 重启自愈：补建 DB 中已存在但 Vault 里丢失的 transit key
  #
  # Vault DEV 模式重启后 transit keys 全部丢失，但 crypto.kek 行仍在。
  # 此 job 查询所有 ACTIVE KEK 行，对每个 vault_path 检查 transit key 是否存在；
  # 若缺失则按 label 推断类型重建（audit.hashchain→ed25519，其余→aes256-gcm96）。
  # NOTE: 重建 transit key 只能封装新 data key；旧版本数据在 DEV 下视为可接受损失。
  # ===========================================================================
  vault-transit-reconcile:
    image: python:3.12-slim-bookworm
    container_name: foundation-vault-transit-reconcile
    restart: "no"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
      PG_DSN: postgresql://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        export PIP_TRUSTED_HOST=pypi.tuna.tsinghua.edu.cn
        pip install --quiet psycopg2-binary requests
        python - <<'PYEOF'
        import os, sys, requests, psycopg2

        vault_addr  = os.environ["VAULT_ADDR"]
        vault_token = os.environ["VAULT_TOKEN"]
        pg_dsn      = os.environ["PG_DSN"]

        headers = {"X-Vault-Token": vault_token}

        def vault_key_exists(key_name):
            r = requests.get(f"{vault_addr}/v1/transit/keys/{key_name}", headers=headers)
            return r.status_code == 200

        def vault_create_key(key_name, key_type):
            r = requests.post(
                f"{vault_addr}/v1/transit/keys/{key_name}",
                headers=headers,
                json={"type": key_type},
            )
            if r.status_code not in (200, 204):
                raise RuntimeError(f"Failed to create transit key {key_name}: {r.status_code} {r.text}")

        def label_to_vault_type(label):
            if label == "audit.hashchain":
                return "ed25519"
            return "aes256-gcm96"

        conn = psycopg2.connect(pg_dsn)
        cur  = conn.cursor()
        cur.execute("SELECT label, vault_path FROM crypto.kek WHERE status = 'ACTIVE'")
        rows = cur.fetchall()
        cur.close()
        conn.close()

        print(f"=== vault-transit-reconcile: found {len(rows)} ACTIVE KEK(s) ===")
        for label, vault_path in rows:
            # vault_path looks like "transit/keys/<key_name>"
            key_name = vault_path.split("/")[-1]
            if vault_key_exists(key_name):
                print(f"  [ok]     {key_name} (label={label}) — transit key present")
            else:
                key_type = label_to_vault_type(label)
                print(f"  [repair] {key_name} (label={label}) — missing, recreating as {key_type}")
                vault_create_key(key_name, key_type)
                print(f"  [repair] {key_name} — recreated")

        print("=== vault-transit-reconcile: done ===")
        sys.exit(0)
        PYEOF
    networks: [foundation]

  # ===========================================================================
  # foundation-crypto — 密码学服务   (port 8004)
  # ===========================================================================
  crypto:
    build:
      context: ../../packages/crypto
      dockerfile: Dockerfile
    container_name: foundation-crypto
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      vault-transit-reconcile:
        condition: service_completed_successfully
      migration-runner:
        condition: service_completed_successfully
    environment:
      CRYPTO_ENV: dev
      CRYPTO_LOG_LEVEL: INFO
      CRYPTO_LOG_FORMAT: console
      CRYPTO_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      CRYPTO_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      CRYPTO_VAULT_URL: http://vault:8200
      CRYPTO_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
      CRYPTO_PROVIDER: vault
      CRYPTO_OTEL_ENABLED: "true"
      CRYPTO_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_CRYPTO:-8004}:8004"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8004/api/crypto/v1/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # foundation-audit — 审计 API 服务   (port 8013, 避免与 BFF 8005 冲突)
  # ===========================================================================
  audit:
    build:
      context: ../../packages/audit
      dockerfile: Dockerfile
    container_name: foundation-audit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      crypto:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      AUDIT_ENV: dev
      AUDIT_LOG_LEVEL: INFO
      AUDIT_LOG_FORMAT: console
      AUDIT_HTTP_PORT: "8013"
      AUDIT_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      AUDIT_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      AUDIT_CLICKHOUSE_HOST: clickhouse
      AUDIT_CLICKHOUSE_PORT: "8123"
      AUDIT_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-foundation}
      AUDIT_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_change_me}
      AUDIT_CLICKHOUSE_DATABASE: audit
      AUDIT_CRYPTO_URL: http://crypto:8004/api/crypto/v1
      AUDIT_CRYPTO_SIGNING_KEY_LABEL: audit.hashchain
      AUDIT_S3_ENDPOINT: http://minio:9000
      AUDIT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-foundation}
      AUDIT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
      AUDIT_WORM_ENABLED: "false"
      AUDIT_TSA_ENABLED: "false"
      AUDIT_OTEL_ENABLED: "true"
      AUDIT_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    command:
      - "foundation_audit.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8013"
      - "--no-access-log"
    ports:
      - "${PORT_AUDIT:-8013}:8013"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8013/api/audit/v1/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # audit-init — 为两个 dev 租户建 audit.hashchain KEK（一次性 job）
  # 必须在 crypto healthy 之后、audit-worker 启动之前完成。
  # 已存在时 crypto 返回 409 → grep -v 过滤掉，curl 返回码取第一次创建的结果；
  # 整体用 "|| true" 使幂等：重跑不报错。
  # ===========================================================================
  audit-init:
    image: curlimages/curl:8.8.0
    container_name: foundation-audit-init
    restart: "no"
    depends_on:
      crypto:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        CRYPTO_URL=http://crypto:8004/api/crypto/v1/keks

        create_kek() {
          TENANT_ID="$$1"
          echo "=== audit-init: creating KEK for tenant $${TENANT_ID} ==="
          HTTP_CODE=$$(curl -s -o /tmp/kek_resp.txt -w "%{http_code}" \
            -X POST "$${CRYPTO_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-Id: $${TENANT_ID}" \
            -H "X-Actor: SYSTEM" \
            -d '{"label":"audit.hashchain","purpose":"AUDIT_HMAC","algorithm_id":"Ed25519","auto_rotate_days":90}')
          if [ "$${HTTP_CODE}" = "201" ]; then
            echo "=== audit-init: KEK created for $${TENANT_ID} ==="
          elif [ "$${HTTP_CODE}" = "409" ]; then
            echo "=== audit-init: KEK already exists for $${TENANT_ID} (idempotent) ==="
          else
            echo "=== audit-init: unexpected HTTP $${HTTP_CODE} for $${TENANT_ID} ===" >&2
            cat /tmp/kek_resp.txt >&2
            exit 1
          fi
        }

        create_kek tnt_01J5DEVXX00000000000000001
        create_kek tnt_01J5DEVXX00000000000000002
        echo "=== audit-init: all KEKs ready ==="
    networks: [foundation]

  # ===========================================================================
  # crypto-fieldencrypt-init — 为两个 dev 租户建 default FIELD_ENCRYPT KEK（一次性 job）
  # LLM gateway 在注册 provider API key 时使用 label=default, purpose=FIELD_ENCRYPT 的 KEK
  # 做信封加密；若缺失则明文存储。此 job 确保 dev 栈始终有该 KEK。
  # 幂等：201 created 或 409 label conflict 均为成功；其余状态打印响应体后 exit 1。
  # ===========================================================================
  crypto-fieldencrypt-init:
    image: curlimages/curl:8.8.0
    container_name: foundation-crypto-fieldencrypt-init
    restart: "no"
    depends_on:
      crypto:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        CRYPTO_URL=http://crypto:8004/api/crypto/v1/keks

        create_kek() {
          TENANT_ID="$$1"
          echo "=== crypto-fieldencrypt-init: creating default KEK for tenant $${TENANT_ID} ==="
          HTTP_CODE=$$(curl -s -o /tmp/kek_resp.txt -w "%{http_code}" \
            -X POST "$${CRYPTO_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-Id: $${TENANT_ID}" \
            -H "X-Actor: SYSTEM" \
            -d '{"label":"default","purpose":"FIELD_ENCRYPT","algorithm_id":"AES-256-GCM","auto_rotate_days":90}')
          if [ "$${HTTP_CODE}" = "201" ]; then
            echo "=== crypto-fieldencrypt-init: KEK created for $${TENANT_ID} ==="
          elif [ "$${HTTP_CODE}" = "409" ]; then
            echo "=== crypto-fieldencrypt-init: KEK already exists for $${TENANT_ID} (idempotent) ==="
          else
            echo "=== crypto-fieldencrypt-init: unexpected HTTP $${HTTP_CODE} for $${TENANT_ID} ===" >&2
            cat /tmp/kek_resp.txt >&2
            exit 1
          fi
        }

        create_kek tnt_01J5DEVXX00000000000000001
        create_kek tnt_01J5DEVXX00000000000000002
        echo "=== crypto-fieldencrypt-init: all default KEKs ready ==="
    networks: [foundation]

  # ===========================================================================
  # authz-init — 为 dev 租户建系统角色 + 绑定 admin super_admin（一次性 job）
  # 依赖 migration-runner 完成（authz schema 已建好）+ postgres healthy。
  # 幂等：角色/绑定已存在时静默跳过（ON CONFLICT 逻辑在脚本里）。
  # ===========================================================================
  authz-init:
    image: python:3.12-slim-bookworm
    container_name: foundation-authz-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      # app_admin 拥有 RLS bypass（admin_all policy），可写 authz.role / role_binding
      AUTHZ_DB_DSN_ADMIN: postgresql+asyncpg://app_admin:${APP_ADMIN_PASSWORD:-app_admin_change_me}@postgres:5432/foundation
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        export PIP_TRUSTED_HOST=pypi.tuna.tsinghua.edu.cn
        pip install --quiet sqlalchemy[asyncio] asyncpg ulid-py
        echo "=== authz-init: installing tenant roles ==="
        run_bootstrap() {
          TENANT_ID="$$1"
          ADMIN_USER_ID="$$2"
          echo "--- tenant $${TENANT_ID} ---"
          python /mnt/authz/scripts/bootstrap_tenant_roles.py \
            --tenant-id "$${TENANT_ID}" \
            $${ADMIN_USER_ID:+--admin-user-id "$${ADMIN_USER_ID}"} \
            --db-url "$${AUTHZ_DB_DSN_ADMIN}"
        }
        # Dev Tenant A: admin@foundation.local 绑 super_admin
        run_bootstrap tnt_01J5DEVXX00000000000000001 usr_01KT7TZ70AM2RK8P0C01KMBPRR
        # Dev Tenant B: 只建角色，无需 admin 绑定
        run_bootstrap tnt_01J5DEVXX00000000000000002 ""
        echo "=== authz-init: all done ==="
    volumes:
      - ../../packages/authz:/mnt/authz:ro
    networks: [foundation]

  # ===========================================================================
  # billing-init — 为 dev 租户塞 PRO 订阅计划 + tenant_subscription + quota_usage（一次性 job）
  # 依赖 migration-runner 完成（billing schema 已建好）+ postgres healthy。
  # 幂等：ON CONFLICT DO NOTHING，重复跑无副作用。
  # ===========================================================================
  billing-init:
    image: pgvector/pgvector:${POSTGRES_VERSION:-pg16}
    container_name: foundation-billing-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres_super_change_me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
