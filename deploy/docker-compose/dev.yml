  # ===========================================================================
  # pam-init — 为 dev 租户 A 塞 1 PENDING + 1 历史 elevation + 1 活跃 session
  # 用 postgres 超管连接绕过 RLS；ON CONFLICT DO NOTHING 幂等。
  # ===========================================================================
  pam-init:
    image: pgvector/pgvector:${POSTGRES_VERSION:-pg16}
    container_name: foundation-pam-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres_super_change_me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== pam-init: seeding elevations + active session for dev tenant A ==="
        psql -h postgres -U postgres -d foundation <<'SQL'
        -- 1) PENDING elevation request
        INSERT INTO pam.pam_elevation_request
          (id, tenant_id, user_id, reason, target_permissions, duration_minutes,
           ticket_reference, status, expires_at)
        VALUES
          ('pmr_01DEVTNA0PENDING00000001',
           'tnt_01J5DEVXX00000000000000001',
           'usr_01J5DEVUSRALICE00000000000',
           '需要临时访问生产数据库排查工单 INC-1042',
           ARRAY['billing:read','billing:write'],
           60, 'INC-1042', 'PENDING',
           now() + interval '60 minutes')
        ON CONFLICT (id) DO NOTHING;

        -- 1b) 第二条 PENDING elevation request（管理后台「待审批」演示用，新 id）
        INSERT INTO pam.pam_elevation_request
          (id, tenant_id, user_id, reason, target_permissions, duration_minutes,
           ticket_reference, status, expires_at)
        VALUES
          ('pmr_01DEVTNA0PENDING00000002',
           'tnt_01J5DEVXX00000000000000001',
           'usr_01J5DEVUSR0BOB000000000000',
           '需要临时升权处理客户紧急工单 INC-2087',
           ARRAY['session:read','session:write'],
           90, 'INC-2087', 'PENDING',
           now() + interval '7 days')
        ON CONFLICT (id) DO NOTHING;

        -- 2) 历史（已 APPROVED）elevation request
        INSERT INTO pam.pam_elevation_request
          (id, tenant_id, user_id, reason, target_permissions, duration_minutes,
           ticket_reference, status, requested_at, expires_at, approved_by, approved_at, approval_reason)
        VALUES
          ('pmr_01DEVTNA0APPROVED0000001',
           'tnt_01J5DEVXX00000000000000001',
           'usr_01J5DEVUSR0BOB000000000000',
           '季度合规审计需要只读访问审计日志',
           ARRAY['audit:read'],
           120, 'AUDIT-Q2', 'APPROVED',
           now() - interval '2 hours',
           now() + interval '7 days',
           'usr_01KT7TZ70AM2RK8P0C01KMBPRR',
           now() - interval '110 minutes',
           '审计窗口期，批准')
        ON CONFLICT (id) DO NOTHING;

        -- 3) 活跃 session（关联上面那条 APPROVED 申请）
        -- expires_at 必须落在未来，否则 get_active_sessions 的 expires_at>now() 过滤会把它筛掉。
        INSERT INTO pam.pam_session
          (id, tenant_id, elevation_request_id, user_id, approved_by, permissions,
           started_at, expires_at, is_active)
        VALUES
          ('pms_01DEVTNA0ACTIVE00000001',
           'tnt_01J5DEVXX00000000000000001',
           'pmr_01DEVTNA0APPROVED0000001',
           'usr_01J5DEVUSR0BOB000000000000',
           'usr_01KT7TZ70AM2RK8P0C01KMBPRR',
           ARRAY['audit:read'],
           now() - interval '110 minutes',
           now() + interval '7 days',
           true)
        ON CONFLICT (id) DO NOTHING;
        SQL
        echo "=== pam-init: all done ==="
    networks: [foundation]

