  # ===========================================================================
  # foundation-security-ops — 安全运营服务   (容器 8019, host 18019)
  # 平台级服务：require_tenant_context=False，多数表无 tenant_id。
  # ===========================================================================
  security-ops:
    build:
      context: ../../packages/security-ops
      dockerfile: Dockerfile
    container_name: foundation-security-ops
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
      security-ops-init:
        condition: service_completed_successfully
    environment:
      SECURITY_OPS_ENV: dev
      SECURITY_OPS_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      SECURITY_OPS_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      SECURITY_OPS_OTEL_ENABLED: "true"
      SECURITY_OPS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_SECURITY_OPS:-18019}:8019"
    networks: [foundation]
    healthcheck:
      # distroless:nonroot 已无 /bin/sh，CMD-SHELL 会失败 → 用 exec 形式直接调 venv python
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8019/api/security-ops/v1/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 20

