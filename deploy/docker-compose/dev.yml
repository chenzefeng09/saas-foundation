        ON CONFLICT (id) DO NOTHING;

        -- 4) sbom_watch（注册监控一个镜像）
        INSERT INTO security_ops.sbom_watch
          (id, image_ref, registered_at, last_scanned_at, notify, new_cves_count)
        VALUES
