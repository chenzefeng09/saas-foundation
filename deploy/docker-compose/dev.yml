           'requests@2.31.0', 'OPEN',
           now() - interval '2 days', now() + interval '12 days',
           'usr_01KT7TZ70AM2RK8P0C01KMBPRR')
        ON CONFLICT (id) DO NOTHING;

        -- 2b) vulnerability：CRITICAL，OPEN，已逾期（due_at 在过去）
        INSERT INTO security_ops.vulnerability
          (id, source, source_ref, cve_id, title, severity, cvss_score,
           package_affected, status, found_at, due_at, assignee)
        VALUES
