# =============================================================================
# saas-foundation 本地开发栈（all-in-one docker-compose）
#
# 一行启动：  cd deploy/docker-compose && cp .env.example .env && docker compose -f dev.yml up -d
# 健康检查： docker compose -f dev.yml ps
# 完整清理： docker compose -f dev.yml down -v
#
# 端口/账号默认值见 .env.example
# 数据卷在 docker volume 里；强制清空请显式加 -v
# =============================================================================

name: saas-foundation-dev

networks:
  foundation:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  clickhouse_data:
  opensearch_data:
  minio_data:
  keycloak_data:
  vault_data:

services:
  # ===========================================================================
  # Postgres — 唯一数据库；多个逻辑库（foundation/keycloak/unleash）共用一个实例
  # 生产 medium+ 改 Patroni 集群
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:${POSTGRES_VERSION:-pg16}
    container_name: foundation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundation}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres_super_change_me}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-app_user_change_me}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-app_admin_change_me}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}
      APP_OBSERVABILITY_PASSWORD: ${APP_OBSERVABILITY_PASSWORD:-app_obs_change_me}
    ports:
      - "${PORT_POSTGRES:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_min_duration_statement=200"

  # ===========================================================================
  # PgBouncer — 强约束 transaction 模式（详见 docs/multi-tenancy.md §4）
  # ===========================================================================
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    container_name: foundation-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT_PGBOUNCER:-6432}:6432"
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks: [foundation]
    healthcheck:
      test: ["CMD", "sh", "-c", "psql 'host=127.0.0.1 port=6432 user=pgbouncer_admin password=pgbouncer_admin_change_me dbname=pgbouncer' -c 'SHOW POOLS' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===========================================================================
  # Redis — Sentinel 模式简化为单实例；medium+ 上 Sentinel
  # ===========================================================================
  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: foundation-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_change_me}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${PORT_REDIS:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [foundation]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # Keycloak — Identity Provider；本地用 dev 模式跳过 hostname 严格校验
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-25.0}
    container_name: foundation-keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: app_migrator
      KC_DB_PASSWORD: ${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_change_me}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Dev: allow plain HTTP and disable HTTPS-only enforcement.
      # KC 25 removed KC_PROXY=edge; switched to proxy-headers.
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: INFO
    ports:
      - "${PORT_KEYCLOAK:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./init/keycloak:/opt/keycloak/data/import:ro
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ===========================================================================
  # ClickHouse — 审计与可观测性后端
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}
    container_name: foundation-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-foundation}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_change_me}
      CLICKHOUSE_DB: audit
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${PORT_CLICKHOUSE_HTTP:-8123}:8123"
      - "${PORT_CLICKHOUSE_TCP:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse/audit-schema.sql:/docker-entrypoint-initdb.d/01-audit-schema.sql:ro
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "wget -nv -O - 'http://127.0.0.1:8123/ping' | grep -q Ok"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # OpenSearch — 搜索；单节点开发模式（生产 3 节点）
  # 默认不启动：无服务连接它。需要时加 --profile extras
  # ===========================================================================
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.16.0}
    container_name: foundation-opensearch
    restart: unless-stopped
    profiles: ["extras"]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-OpenSearch_Change_Me_123!}
      plugins.security.disabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${PORT_OPENSEARCH_HTTP:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://127.0.0.1:9200/_cluster/health | grep -E 'yellow|green'"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # Vault — KMS / Secret 管理；本地开发模式（生产 raft + 3 节点）
  # ===========================================================================
  vault:
    image: hashicorp/vault:${VAULT_VERSION:-1.17}
    container_name: foundation-vault
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    ports:
      - "${PORT_VAULT:-8200}:8200"
    volumes:
      - vault_data:/vault/file
    networks: [foundation]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # MinIO — S3 兼容对象存储；带 Object Lock 支持（WORM）
  # 必须在 server 命令中加 --console-address 且不传 --no-lock 才能开启 Object Lock
  # ===========================================================================
  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    container_name: foundation-minio
    restart: unless-stopped
    # --console-address enables the UI; Object Lock requires no extra server flag in RELEASE.2024+
    command: ["server", "/data", "--console-address", ":9002"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foundation}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
    ports:
      - "${PORT_MINIO_API:-9001}:9000"
      - "${PORT_MINIO_CONSOLE:-9002}:9002"
    volumes:
      - minio_data:/data
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || curl -sf http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # minio-init — 建 WORM bucket（一次性 job）
  # mc mb --with-lock 建带 Object Lock 的 bucket；--ignore-existing 确保幂等
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: foundation-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-foundation} ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
        # Create WORM bucket with Object Lock enabled (--with-lock)
        mc mb --with-lock --ignore-existing local/foundation-audit-worm
        # Set default COMPLIANCE retention: 7 years
        mc retention set --default COMPLIANCE "7y" local/foundation-audit-worm
        echo "=== minio-init: foundation-audit-worm bucket ready ==="
    networks: [foundation]

  # ===========================================================================
  # OPA — 授权策略引擎
  # ===========================================================================
  opa:
    image: openpolicyagent/opa:1.16.2-static
    container_name: foundation-opa
    restart: unless-stopped
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--log-level=info"
      - "--set=decision_logs.console=true"
      - "--ignore=*_test.rego"
      - "/policies"
      - "/data"
    volumes:
      - ./config/opa/policies:/policies:ro
      - ./config/opa/data:/data:ro
    ports:
      - "8181:8181"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8181/health | grep -q '{}'"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ===========================================================================
  # migration-runner — 按序跑所有 foundation 服务的 Alembic 迁移（一次性 job）
  #
  # 顺序：identity → authz → org → billing（billing 依赖 tenant.tenant FK）
  # 每个服务从自己的 builder stage 跑，builder 有 shell + 完整 Python 包
  # billing 的 Dockerfile 未打包 migrations/alembic.ini，用 volume 挂载补全
  # ===========================================================================
  migration-runner:
    image: python:3.12-slim-bookworm
    container_name: foundation-migration-runner
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      IDENTITY_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      AUTHZ_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      ORG_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      BILLING_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      CRYPTO_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      CRYPTO_VAULT_URL: http://vault:8200
      CRYPTO_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
      AUDIT_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        pip install --quiet poetry
        # Put venvs in /tmp so we don't write into the read-only source mounts
        export POETRY_VIRTUALENVS_PATH=/tmp/poetry-venvs
        export POETRY_VIRTUALENVS_IN_PROJECT=false
        run_migration() {
          svc="$$1"; pkg_dir="$$2"
          echo "=== Running $${svc} migrations ==="
          cd "$${pkg_dir}"
          poetry install --only main --quiet
          poetry run alembic upgrade head
          echo "=== $${svc} migrations done ==="
        }
        run_migration identity /mnt/identity
        run_migration authz    /mnt/authz
        run_migration org      /mnt/org
        run_migration billing  /mnt/billing
        run_migration crypto   /mnt/crypto
        run_migration audit    /mnt/audit
        echo "=== All migrations complete ==="
    networks: [foundation]
    volumes:
      - ../../packages/identity:/mnt/identity:ro
      - ../../packages/authz:/mnt/authz:ro
      - ../../packages/org:/mnt/org:ro
      - ../../packages/billing:/mnt/billing:ro
      - ../../packages/crypto:/mnt/crypto:ro
      - ../../packages/audit:/mnt/audit:ro

  # ===========================================================================
  # foundation-identity — 身份服务   (port 8001)
  # ===========================================================================
  identity:
    build:
      context: ../../packages/identity
      dockerfile: Dockerfile
    container_name: foundation-identity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      IDENTITY_ENV: dev
      IDENTITY_LOG_LEVEL: INFO
      IDENTITY_LOG_FORMAT: console
      IDENTITY_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      IDENTITY_DB_DSN_ADMIN: postgresql+asyncpg://app_admin:${APP_ADMIN_PASSWORD:-app_admin_change_me}@pgbouncer:6432/foundation
      IDENTITY_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      IDENTITY_KEYCLOAK_URL: http://keycloak:8080
      IDENTITY_KEYCLOAK_REALM: foundation
      IDENTITY_KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      IDENTITY_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak_admin_change_me}
      IDENTITY_VAULT_URL: http://vault:8200
      IDENTITY_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
      IDENTITY_OTEL_ENABLED: "true"
      IDENTITY_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      IDENTITY_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_change_me}@redis:6379/0
    ports:
      - "${PORT_IDENTITY:-8001}:8001"
    networks:
      foundation:
        aliases:
          - identity-service
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8001/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # foundation-authz — 授权服务   (port 8002)
  # ===========================================================================
  authz:
    build:
      context: ../../packages/authz
      dockerfile: Dockerfile
    container_name: foundation-authz
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      AUTHZ_ENV: dev
      AUTHZ_LOG_LEVEL: INFO
      AUTHZ_LOG_FORMAT: console
      AUTHZ_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      AUTHZ_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      AUTHZ_OPA_URL: http://opa:8181/v1
      AUTHZ_OTEL_ENABLED: "true"
      AUTHZ_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_AUTHZ:-8002}:8002"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8002/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # foundation-org — 组织服务   (port 8003)
  # ===========================================================================
  org:
    build:
      context: ../../packages/org
      dockerfile: Dockerfile
    container_name: foundation-org
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      ORG_ENV: dev
      ORG_LOG_LEVEL: INFO
      ORG_LOG_FORMAT: console
      ORG_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      ORG_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      ORG_OTEL_ENABLED: "true"
      ORG_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_ORG:-8003}:8003"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8003/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # foundation-billing — 计费服务   (port 8007)
  # ===========================================================================
  billing:
    build:
      context: ../../packages/billing
      dockerfile: Dockerfile
    container_name: foundation-billing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      BILLING_ENV: dev
      BILLING_LOG_LEVEL: INFO
      BILLING_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      BILLING_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      BILLING_OTEL_ENABLED: "true"
      BILLING_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_BILLING:-8007}:8007"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8007/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # Unleash — Feature Flag
  # 默认不启动：无服务连接它。需要时加 --profile extras
  # ===========================================================================
  unleash:
    image: unleashorg/unleash-server:${UNLEASH_VERSION:-6.4}
    container_name: foundation-unleash
    restart: unless-stopped
    profiles: ["extras"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      INIT_ADMIN_API_TOKENS: "*:*.unleash-insecure-admin-api-token"
      INIT_FRONTEND_API_TOKENS: "*:development.unleash-insecure-frontend-api-token"
    ports:
      - "${PORT_UNLEASH:-4242}:4242"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4242/health | grep -q OK"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # OTel Collector — 收口所有 trace/log/metric，转发到 Jaeger（本地）
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.108.0}
    container_name: foundation-otel
    restart: unless-stopped
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./config/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "${PORT_OTEL_GRPC:-4317}:4317"
      - "${PORT_OTEL_HTTP:-4318}:4318"
    networks: [foundation]
    depends_on:
      - jaeger

  # ===========================================================================
  # Jaeger — 本地 trace 可视化（生产用 ClickHouse + Grafana Tempo）
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: foundation-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${PORT_JAEGER_UI:-16686}:16686"
    networks: [foundation]

  # ===========================================================================
  # vault-init — 启用 Vault transit secrets engine（一次性 job）
  # crypto 服务依赖 transit engine 已开启才能创建/使用 KEK
  # ===========================================================================
  vault-init:
    image: hashicorp/vault:${VAULT_VERSION:-1.17}
    container_name: foundation-vault-init
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Initialising Vault transit engine ==="
        vault secrets enable transit || true
        echo "=== Vault transit ready ==="
        # TODO: create audit.hashchain signing key for audit worker
        # vault write -f transit/keys/audit.hashchain type=ed25519
        # (omitted: key label is tenant-scoped in production; for dev, audit
        # worker will fail signing until the KEK exists in the crypto.kek table
        # AND vault has the corresponding transit key. Use the crypto service
        # POST /api/crypto/v1/keks endpoint to bootstrap the key before running
        # the audit worker in a fresh dev environment.)
    networks: [foundation]

  # ===========================================================================
  # foundation-crypto — 密码学服务   (port 8004)
  # ===========================================================================
  crypto:
    build:
      context: ../../packages/crypto
      dockerfile: Dockerfile
    container_name: foundation-crypto
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      migration-runner:
        condition: service_completed_successfully
    environment:
      CRYPTO_ENV: dev
      CRYPTO_LOG_LEVEL: INFO
      CRYPTO_LOG_FORMAT: console
      CRYPTO_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      CRYPTO_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      CRYPTO_VAULT_URL: http://vault:8200
      CRYPTO_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:-dev-root-token-change-me}
      CRYPTO_PROVIDER: vault
      CRYPTO_OTEL_ENABLED: "true"
      CRYPTO_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    ports:
      - "${PORT_CRYPTO:-8004}:8004"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8004/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # foundation-audit — 审计 API 服务   (port 8013, 避免与 BFF 8005 冲突)
  # ===========================================================================
  audit:
    build:
      context: ../../packages/audit
      dockerfile: Dockerfile
    container_name: foundation-audit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      crypto:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      AUDIT_ENV: dev
      AUDIT_LOG_LEVEL: INFO
      AUDIT_LOG_FORMAT: console
      AUDIT_HTTP_PORT: "8013"
      AUDIT_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      AUDIT_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      AUDIT_CLICKHOUSE_HOST: clickhouse
      AUDIT_CLICKHOUSE_PORT: "8123"
      AUDIT_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-foundation}
      AUDIT_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_change_me}
      AUDIT_CLICKHOUSE_DATABASE: audit
      AUDIT_CRYPTO_URL: http://crypto:8004/api/crypto/v1
      AUDIT_CRYPTO_SIGNING_KEY_LABEL: audit.hashchain
      AUDIT_S3_ENDPOINT: http://minio:9000
      AUDIT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-foundation}
      AUDIT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
      AUDIT_WORM_ENABLED: "false"
      AUDIT_TSA_ENABLED: "false"
      AUDIT_OTEL_ENABLED: "true"
      AUDIT_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    command:
      - "foundation_audit.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8013"
      - "--no-access-log"
    ports:
      - "${PORT_AUDIT:-8013}:8013"
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8013/healthz\").read()' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # audit-init — 为两个 dev 租户建 audit.hashchain KEK（一次性 job）
  # 必须在 crypto healthy 之后、audit-worker 启动之前完成。
  # 已存在时 crypto 返回 409 → grep -v 过滤掉，curl 返回码取第一次创建的结果；
  # 整体用 "|| true" 使幂等：重跑不报错。
  # ===========================================================================
  audit-init:
    image: curlimages/curl:8.8.0
    container_name: foundation-audit-init
    restart: "no"
    depends_on:
      crypto:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        CRYPTO_URL=http://crypto:8004/api/crypto/v1/keks

        create_kek() {
          TENANT_ID="$$1"
          echo "=== audit-init: creating KEK for tenant $${TENANT_ID} ==="
          HTTP_CODE=$$(curl -s -o /tmp/kek_resp.txt -w "%{http_code}" \
            -X POST "$${CRYPTO_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Tenant-Id: $${TENANT_ID}" \
            -H "X-Actor: SYSTEM" \
            -d '{"label":"audit.hashchain","purpose":"AUDIT_HMAC","algorithm_id":"Ed25519","auto_rotate_days":90}')
          if [ "$${HTTP_CODE}" = "201" ]; then
            echo "=== audit-init: KEK created for $${TENANT_ID} ==="
          elif [ "$${HTTP_CODE}" = "409" ]; then
            echo "=== audit-init: KEK already exists for $${TENANT_ID} (idempotent) ==="
          else
            echo "=== audit-init: unexpected HTTP $${HTTP_CODE} for $${TENANT_ID} ===" >&2
            cat /tmp/kek_resp.txt >&2
            exit 1
          fi
        }

        create_kek tnt_01J5DEV0000000000000000AA
        create_kek tnt_01J5DEV0000000000000000BB
        echo "=== audit-init: all KEKs ready ==="
    networks: [foundation]

  # ===========================================================================
  # foundation-audit-worker — 审计 Batch Worker（outbox → ClickHouse + 签名）
  # 与 audit api 共用同一镜像，执行不同 entrypoint（worker console script）
  # ===========================================================================
  audit-worker:
    build:
      context: ../../packages/audit
      dockerfile: Dockerfile
    container_name: foundation-audit-worker
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/foundation-audit-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      crypto:
        condition: service_healthy
      audit-init:
        condition: service_completed_successfully
      migration-runner:
        condition: service_completed_successfully
    environment:
      AUDIT_ENV: dev
      AUDIT_LOG_LEVEL: INFO
      AUDIT_LOG_FORMAT: console
      AUDIT_DB_DSN: postgresql+asyncpg://app_user:${APP_USER_PASSWORD:-app_user_change_me}@pgbouncer:6432/foundation
      AUDIT_DB_DSN_MIGRATOR: postgresql+asyncpg://app_migrator:${APP_MIGRATOR_PASSWORD:-app_migrator_change_me}@postgres:5432/foundation
      AUDIT_CLICKHOUSE_HOST: clickhouse
      AUDIT_CLICKHOUSE_PORT: "8123"
      AUDIT_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-foundation}
      AUDIT_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_change_me}
      AUDIT_CLICKHOUSE_DATABASE: audit
      AUDIT_CRYPTO_URL: http://crypto:8004/api/crypto/v1
      AUDIT_CRYPTO_SIGNING_KEY_LABEL: audit.hashchain
      AUDIT_S3_ENDPOINT: http://minio:9000
      AUDIT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-foundation}
      AUDIT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_change_me_min_12_chars}
      AUDIT_WORM_ENABLED: "false"
      AUDIT_TSA_ENABLED: "false"
      AUDIT_OTEL_ENABLED: "true"
      AUDIT_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    networks: [foundation]

  # ===========================================================================
  # Mailhog — 本地 SMTP 测试
  # 默认不启动：无服务连接它。需要时加 --profile extras
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:${MAILHOG_VERSION:-v1.0.1}
    container_name: foundation-mailhog
    restart: unless-stopped
    profiles: ["extras"]
    ports:
      - "${PORT_MAILHOG_UI:-8025}:8025"
      - "${PORT_MAILHOG_SMTP:-1025}:1025"
    networks: [foundation]
