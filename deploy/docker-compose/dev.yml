        set -e
        echo "=== identity-init: seeding 4 dev users into identity.user ==="
        psql -h postgres -U postgres -d foundation <<'SQL'
        -- 4 dev users (mapped from Keycloak realm seed)
        -- 连接为 postgres 超级用户，FORCE RLS 对超级用户不生效，无需 SET app.actor
