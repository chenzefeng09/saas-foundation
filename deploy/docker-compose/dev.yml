  # ===========================================================================
  # identity-init — 为 dev 用户在 identity.user 表中建立初始行（一次性 job）
  # 依赖 migration-runner 完成（identity schema 已建好）+ postgres healthy。
  # 幂等：ON CONFLICT (id) DO NOTHING，重复跑无副作用（INSERT 0 0）。
  # 以 postgres 超级用户连接，绕过 FORCE RLS（超级用户不受 RLS 约束）。
  # ===========================================================================
  identity-init:
    image: pgvector/pgvector:${POSTGRES_VERSION:-pg16}
    container_name: foundation-identity-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres_super_change_me}
    entrypoint: ["/bin/sh", "-c"]
    command:
