[tool.poetry]
name = "foundation-sdk"
version = "0.1.0"
description = "Python SDK for SaaS Foundation — typed client for all 16 microservices"
authors = ["SaaS Foundation Team <foundation@example.com>"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "foundation_sdk", from = "." }]

[tool.poetry.dependencies]
python = "^3.12"
httpx = { extras = ["http2"], version = "^0.27.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
itsdangerous = "^2.2.0"  # CookieSigner — see foundation_sdk/_signing.py
# fastapi is an OPTIONAL extra: SDK consumers that build a FastAPI service
# install `foundation-sdk[fastapi]` to get shared middleware + handler helpers.
# Pure SDK clients (workers, CLIs) don't pay the dependency.
fastapi = { version = "^0.115.0", optional = true }

[tool.poetry.extras]
fastapi = ["fastapi"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.0"
respx = "^0.21.1"
fastapi = "^0.115.0"  # dev needs it so the [fastapi] module can be tested

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["foundation_sdk"]

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","ASYNC","RUF"]
ignore = ["S101"]
