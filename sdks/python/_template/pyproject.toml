[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "foundation-template"
version = "0.1.0"
description = "Template package for SaaS Foundation Python SDKs. Copy & rename for each service."
authors = ["SaaS Foundation Team <foundation@example.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{include = "foundation_template"}]

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.27"
pydantic = "^2.7"
pydantic-settings = "^2.3"
opentelemetry-api = "^1.25"
opentelemetry-instrumentation-httpx = "^0.46b0"
tenacity = "^9.0"
python-ulid = "^2.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-httpx = "^0.30"
mypy = "^1.10"
ruff = "^0.5"
respx = "^0.21"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "TCH", "RUF"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
